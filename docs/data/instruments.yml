  warning1: Note that infant heart rate sensor data may contain non-consecutive samples. The most likely reason is an inconsistent connection between the sensor and the receiver tablet, which can result in missing samples. Always refer to the timestamps embedded in the files to reconstruct the temporal sequence of the data. Infant heart rate sensor recordings may also be shorter than the planned 72 hours, which can occur due to human error, technical issues, or a parent/legal guardian deciding to discontinue data collection.
  description: |-
    **Infant Heart Rate Wearable Sensor data** captures information related to the infant's physiology and sleep. The device is fastened to the infant's upper arm with a soft-textile band by HBCD Study staff and worn for 72 hours, during which time data is collected across the child's typical activities in their natural environment. The photoplethysmography (PPG) sensors (one emitting green light PPG and one emitting red light PPG) embedded in the device allow for the collection of three biosignal estimates sampled at 1 Hz:

    - **Rulse rate** (beats per minute)
    - **Blood oxygen saturation** (SpO2, percentage)
    - **Respiratory rate** (breaths per minute)

    In addition, sleep states are derived from these vital sign data. Data collection is planned for 72 continuous hours. Caregivers followed typical routines, removing the sensor only for water exposure (e.g., baths) and repositioning it afterward. See [Pini et al. 2024](https://www.sciencedirect.com/science/article/pii/S1878929324001075?via%3Dihub) for a full measure description.
  slug: gabi-infant-heart-rate-
  domain: Novel Tech & Wearable Sensors
  release: '3.0'
  qc: |-
    For the 72-hour sensor data files, a random selection of files was manually reviewed on a weekly basis for the presence of data, adequate file duration, and discrepancies with the set-up/return forms. Note that only a small percentage of the total infant heart rate wearable sensor data files were reviewed because the procedure was manual.

    Issues with the sensor data were generally rare, and most data were deemed present and accurately collected (when captured correctly). Errors that did arise were corrected, when possible, though this was typically not feasible. Common errors noted included inadequate or missing data (due to human error, technical issues, or a parent/legal guardian declining participation in this aspect of the study), sensors being removed for extended periods during the 72-hour collection, or unavailability of devices to conduct the data collection.
