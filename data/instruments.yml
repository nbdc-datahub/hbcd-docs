  supp1_text: |-
    ## Age, Sex, Baseline Socioeconomic & Other Variables

    The Static Table includes selected child, birth-mother, household, recruitment, and contextual characteristics, represented once per HBCD child. The original source and collection timing vary by variable and are documented in the accompanying variable information.

    Child sex, maternal age at V01, maternal age at delivery, gestational age at delivery, recruitment site, and selected other characteristics are derived from HBCD administrative or enrollment records. Baseline birth-mother education and V01 household income are derived from responses collected through the Adult Demographics instrument and are included here as baseline reference characteristics.

    Because education and household income may change over time, their inclusion in the Static Demographics Table should not be interpreted as indicating that these characteristics are inherently fixed. The Dynamic Table provides longitudinal measures of caregiver education and household income.

    The Static Table also includes a baseline residential Area Deprivation Index (ADI) measure derived using the residential address available at screening. This measure represents neighborhood context at that designated time point and should not be interpreted as a longitudinal measure of residential context.
