  assessment_type: Cognitive testing
  table_name: ncl_ch_bayley
  warning2: Although the Bayley Scales of Infant and Toddler Development, Fourth Edition, is a well-established and validated measure of infant development, tests of this nature have historically had limited predictive validity for long-term neurocognitive status.
