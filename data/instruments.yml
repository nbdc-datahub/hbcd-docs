bayley_4:
  supp2_text: null
  status: DONE! Complete/stable for release
  alert1: Performance of the Bayley Scales of Infant and Toddler Development, Fourth Edition, reflects the child's developmental status, but various factors might influence the results of the assessment that should be taken into account.
  hbcd_mods2_title: Use of Caregiver Questions
  hbcd_mods1: The test was designed to be administered by trained clinicians. For the HBCD Study, however, administration was performed primarily by trained Research Assistants (RAs). HBCD implemented a rigorous training and certification process to ensure that all RAs met study-wide standards before conducting assessments. For training, subject matter experts (licensed psychologists with expertise in infant testing and BSID-4 administration) provided lectures, group discussions, and office hours for individualized guidance. To be certified, RAs were required to submit both a recorded administration and their QGlobal item-level scoring for expert review.
  duration: 60-90 min
  hbcd_mods2: The use of Caregiver Questions on the BSID-4 was modified. RAs were instructed to query the caregiver if the child scored below a 2 on items where caregiver input is permitted to inform the assessment. The BSID-4 manual specifies using caregiver reports when the target behavior “has not been observed.” It also notes that caregiver questions were used in 95% of administrations in the normative sample, with no formal limit on their use. The manual indicates that the assessment’s validity may be questioned if there are frequent discrepancies between what is observed and what is reported.
  full_name: Bayley Scales of Infant and Toddler Development, Fourth Edition
  alert3: The child's exposure to different languages may also impact their performance. The Multilingual Language Development questionnaire was used to screen for parental preference for the test to be administered in Spanish or English (Spanish language translations used are available upon request). The instrument also documents other language exposures that the child may have. Exposure to languages other than Spanish or English may impact a child's performance. In addition, some items on the test may be impacted by environmental experiences related to the task or items used. In these cases, the test may underestimate the child's developmental status.
  warning4: null
  alert2: The test was given in the context of a battery of tests and procedures administered to the child and his/her caregiver during the course of an extended visit. Some children may experience fatigue from this and this may have adversely impacted their performance. Ratings of arousal level of the child before and after the assessment may help in identifying situations where the child may have under-performed.
  assessment_type: Cognitive testing
  table_name: ncl_ch_bayley
  warning2: Although the Bayley Scales of Infant and Toddler Development, Fourth Edition, is a well-established and validated measure of infant development, tests of this nature have historically had limited predictive validity for long-term neurocognitive status.
  warning2_title: Limited Predictive Validity for Long-Term Neurocognitive Status
  references: 'Bayley, N., & Aylward, G. (2019). _Administration Manual: Bayley Scales Infant Toddler Development, Fourth Edition_. Pearson.'
  respondent_category: Parent on Child
  admin_notes: 8/22 requested updates to data warnings complete
