  warning1: Note that infant heart rate sensor data may contain non-consecutive samples. The most likely reason is an inconsistent connection between the sensor and the receiver tablet, which can result in missing samples. Always refer to the timestamps embedded in the files to reconstruct the temporal sequence of the data. Infant heart rate sensor recordings may also be shorter than the planned 72 hours, which can occur due to human error, technical issues, or a parent/legal guardian deciding to discontinue data collection.
  description: "**Infant Heart Rate Wearable Sensor data** captures information related to the infant's physiology and sleep. The device is fastened to the infant's upper arm with a soft-textile band by HBCD Study staff and worn for 72 hours, during which time data is collected across the child's typical activities in their natural environment. The photoplethysmography (PPG) sensors (one emitting green light PPG and one emitting red light PPG) embedded in the device allow for the collection of three biosignal estimates sampled at 1 Hz:\n\n- **Rulse rate** (beats per minute)\n- **Blood oxygen saturation** (SpO2, percentage)\n- **Respiratory rate** (breaths per minute)\n\nIn addition, sleep states are derived from these vital sign data. Data collection is planned for 72 continuous hours. Caregivers followed typical routines, removing the sensor only for water exposure (e.g., baths) and repositioning it afterward. See [Pini et al. 2024](https://www.sciencedirect.com/science/article/pii/S1878929324001075?via%3Dihub)\
    \ for a full measure description.\n\n##### Raw BIDS\n\nThe current release includes the raw BIDS data for infant HR data, including HR, SpO2, and RR along with their respective measures of reliability, timestamps, and metadata.\n\n```\nhbcd/\n└── rawdata/ \n    └── sub-[ID]\n        └── ses-[V0X]\n            └── beh/\n                ├── *_task-rest_acq-HeartRateSensor_recording-plx_beh.json\n                ├── *_task-rest_acq-HeartRateSensor_recording-plx_beh.tsv.gz\n                ├── *_task-rest_acq-HeartRateSensor_recording-temperature_beh.json\n                └── *_task-rest_acq-HeartRateSensor_recording-temperature_beh.tsv.gz\n```"
