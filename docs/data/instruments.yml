  references: |-
    Bandoli, G., Kable, J. A., Coles, C. D., Del Campo, M., Suttie, M., & Chambers, C. D. (2022). Trajectories of prenatal alcohol exposure and behavioral outcomes: Findings from a community-based sample. _Drug and Alcohol Dependence_, **233**(109351), 109351. <https://doi.org/10.1016/j.drugalcdep.2022.109351>
    Massey, S. H., Pool, L. R., Estabrook, R., Level, R. A., Shisler, S., Stacks, A. M., Neiderhiser, J. M., Espy, K. A., Wakschlag, L. S., Eiden, R. D., & Allen, N. B. (2022). Within-person decline in pregnancy smoking is observable prior to pregnancy awareness: Evidence across two independent observational cohorts. _Addiction Biology_, **27**(6), e13245. <https://doi.org/10.1111/adb.13245>
    Massey, S. H., Allen, N. B., Pool, L. R., Miller, E. S., Pouppirt, N. R., Barch, D. M., Luby, J., Perlman, S. B., Rogers, C. E., Smyser, C. D., & Wakschlag, L. S. (2021). Impact of prenatal exposure characterization on early risk detection: Methodologic insights for the HEALthy Brain and Child Development (HBCD) study. _Neurotoxicology and Teratology_, **88**(107035), 107035. <https://doi.org/10.1016/j.ntt.2021.107035>
    Massey, S. H., Mroczek, D. K., Reiss, D., Miller, E. S., Jakubowski, J. A., Graham, E. K., Shisler, S. M., McCallum, M., Huestis, M. A., Ganiban, J. M., Shaw, D. S., Leve, L. D., Eiden, R. D., Stroud, L. R., & Neiderhiser, J. M. (2018). Additive drug-specific and sex-specific risks associated with co-use of marijuana and tobacco during pregnancy: Evidence from 3 recent developmental cohorts (2003-2015). _Neurotoxicology and Teratology_, **68**, 97–106. <https://doi.org/10.1016/j.ntt.2018.06.002>
    Si, Y., Bandoli, G., Cole, K. M., Daniele Fallin, M., Stuart, E. A., Gurka, K. K., Althoff, K. N., Thompson, W. K., & the HBCD Design Workgroup and Biostatistics Workgroup. (2024). Advancing high quality longitudinal data collection: Implications for the HEALthy Brain and Child Development (HBCD) Study design and recruitment. _Developmental Cognitive Neuroscience_, **69**(101432), 101432. <https://doi.org/10.1016/j.dcn.2024.101432>
