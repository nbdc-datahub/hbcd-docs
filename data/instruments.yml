  warning1: Note that different sites may apply varying criteria for identifying motion-degraded QALAS and B1+ mapping scans. For 3D-QALAS, the SyMRI toolbox does **not** incorporate externally acquired B1+ field maps when estimating quantitative T1, T2, and proton density (PD) values.
  description: 'Conventional neuroimaging relies on qualitative relaxation-weighted images (e.g., T1w, T2w), which reflect relative differences in tissue properties, but are strongly influenced by sequence parameters, participant positioning, and scanner hardware. These dependencies limit biological interpretability and hinder comparisons across participants, sessions, and sites. The challenge is especially pronounced in pediatric imaging, where rapid age-related changes in free water distribution, iron, and myelination dynamically alter image contrast.


    **Quantitative MRI (qMRI)** addresses these limitations by directly measuring relaxation properties, providing more reliable markers of brain tissue microstructure ([Deoni 2010](https://doi.org/10.1097/RMR.0b013e31821e56d8); [Does 2018](https://doi.org/10.1016/j.neuroimage.2017.12.087)). The HBCD Study acquires 3D-QALAS, a time-efficient 3D sequence that combines interleaved Look-Locker acquisition with a T2-preparation pulse ([Kvernby et al. 2014](https://doi.org/10.1186/s12968-014-0102-0)). This approach enables simultaneous estimation of T1/T2 relaxation times and proton density (PD) maps from a single scan and has been validated across major MRI vendors ([Fujita et al. 2019](https://doi.org/10.1016/j.mri.2019.08.031)).'
  slug: quantitative-mri
  domain: Imaging/Tabular Imaging
  release: '2.1'
  qc: null
  administration: In-person
  supp1_text: '## Acquisition


    ### QALAS


    QALAS is a multi-contrast MRI sequence that produces five brain volumes using turbo-flash readouts with varying T1 and T2 weightings (acquisition time ~5 min for Siemens and ~4 min for GE/Philips). These volumes are combined to estimate T1, T2, and proton density (PD) maps. The sequence starts with a T2-preparation pulse, which adds T2 weighting to the first volume. An inversion pulse follows, imparting T1 weighting to the next four volumes. See the 3D-QALAS Sequence in [Fujita et. al, 2024](https://onlinelibrary.wiley.com/doi/10.1002/mrm.29939) ([Figure. 1](https://onlinelibrary.wiley.com/cms/asset/d6169e7c-9f2f-4c21-8b35-2ce495b265e8/mrm29939-fig-0001-m.jpg)).


    ### B1+ Fieldmaps


    The HBCD protocol includes a short B1+ field map acquisition (~30–45 seconds across all scanner types) to calibrate flip angle measurements, which can vary spatially due to B1+ field inhomogeneity. This calibration is required for accurate T1, T2, and PD estimation. Because the transmit B1+ field varies smoothly across space, coarse spatial resolution is sufficient, enabling rapid acquisition. Vendor-specific implementations in the HBCD protocol include Actual Flip Angle Imaging (AFI) for GE and Philips, and a pre-saturation turbo-FLASH readout for Siemens ([Yarnykh 2007](https://doi.org/10.1002/mrm.21120)).'
  measure: Quantitative MRI
