    <img src="https://github.com/nbdc-datahub/hbcd-docs/raw/main/docs/resources/biospec/Fig1_nails.png" alt="Nail processing workflow" width="600" height="auto" class="center">

    For the USDTL assay, fingernail and toenail specimens are sorted by weight, and those weighing at least 20 mg undergo ELISA screening, followed by LCMSMS confirmation for presumptive positives, each requiring an additional 20 mg. If insufficient specimen remains for LCMSMS, the remnant ELISA extract is used for confirmation.

    Based on the predefined thresholds (see _Nail Assay Thresholds_ below), a confirmatory test result for any substance analyte is determined to be positive, negative, or invalid (_QNS_ i.e. _quantity not sufficient_). Substance analytes (e.g. **Amphetamine/`c_amp_n`**) are grouped into different classes by analyte screening tests and confirmatory tests (see _Mapping from Class to Screening & Confirmatory Tests_).
