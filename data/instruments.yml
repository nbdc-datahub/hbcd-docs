    - In 12 cases, the TIC Questionnaire was erroneously completed at V4 instead of V6
    - In some early cases, RAs did not administer the TIC Questionnaire because they thought it was the same as the TIC Screener. However, these are different instruments
    - Missing data patterns
  description: |-
    The TIC Questionnaire is designed to capture children’s formal and informal transitions to alternate or non-parental care that last for 2 weeks or more, including living in foster care, kinship care, with other relatives, or in other non-parental care arrangements. The transitions involve the child being separated from the parent/caregiver who usually lives with the child and usually provides support, care, and decision-making. The transitions documented do NOT include very short periods like a weekend away or a vacation, or periods of time like when the parent was working or had an appointment.

    The measure asks about whether or not a transition has occurred, when the transition occurred, how long it lasted, and the reasons for the transition. It also asks about who cared for the child during the transition (e.g., grandparent, foster parent, etc). The TIC Questionnaire is completed by the caregiver or parent who is the adult participant in the HBCD study at the time of the assessment. The questions are based on the National Survey of Health 2011-2012 follow-up study of children living in non-parental care.
