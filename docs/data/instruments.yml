  description: "USDTL Blood is a toxicology screen for substances & environmental exposures (metals, nutrition, toxins, proteins) conducted on phlebotomist-collected venous blood pipetted onto dried blood spot cards. Processing of blood spot cards consists of preparing 3x 1/8” punches of dried blood spot followed by extraction using an organic solvent. Detection of PETH in the extract is accomplished with a single pass using LCMSMS: \n\n<img src=\"https://github.com/nbdc-datahub/hbcd-docs/raw/main/docs/images/Fig1_blood.png\" alt=\"PeTH test\" width=\"600\" height=\"auto\" class=\"center\">\n\nBased on the predefined threshold below, the PEth test (`c_peth_b_cat`) is determined to be positive, negative, or canceled. Substance analytes are grouped into classes by analyte screening tests and confirmatory tests. PEth is confirmatory-testing only:\n\n- **Confirmatory test**: 20phsphtdetbsp (`c_peth_b_cat`)\n- **Class**: Ethanol (`c_ethanol_b`)"
  slug: usdtl-blood-toxicology
  domain: Biospecimen & Omics
  release: '3.0'
  qc: Examine assay ranges and categorical versus continuous measures.
  administration: In-person
  scoring: |-
    Final PEth assay results follow these rules:

    - If the PEth test is positive (`c_peth_b_cat`), the sample level (`c_any_specimen_b`) is positive (value = 1).
    - If the PEth confirmatory tests is negative (value = 0), then sample-level (`c_any_specimen_b`) is negative (0).
    - If the PEth confirmatory tests is cancelled (value = 3) then sample-level (`c_any_specimen_b`) is cancelled (value = 3).
  all_warnings_collapsed: |-
    Continuous Variables
