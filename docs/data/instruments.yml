  description: The **Multidimensional Assessment Profiles- Temper Loss scale (MAPS-TL)** is a well-validated survey assessing irritability that serves as a tool for characterizing the developmental expression of early mental health risk. MAPS-TL measures a range of behaviors that encompass dysregulation, responsiveness to environmental input, and context. Questions inquire about the behaviors of the focal child over the past month. Irritability has been identified as an early dimensional marker of lifespan mental health risk. MAPS-TL aims to delineate the typical-to-atypical spectrum of irritability in early childhood and identify those young children at high probability of subsequent adaptational problems based on problems with dysregulation.
  slug: multidimensional-assessment-profiles-temper-loss-scale
  domain: Behavior & Caregiver-Child Interactions
  release: '2.1'
  qc: |-
    - Examine missingness by counting items answered per participant.
    - Check age is within expected ranges  (3-9/10-17 months for Infant/Toddlerhood).
    - Review summary statistics and visualizations (item frequencies, age, prorated scores).
    - Assess reliability (Cronbach’s α).
  administration: Remote
  scoring: |-
    The MAPS-TL includes 17 items at Visit 3 (V03) and 40 items at Visit 5 (V05). Items are rated on a 6-point frequency scale, where higher scores indicate more frequent occurrence of the measured behaviors (_1 = Never, 2 = Rarely (<1 day/week), 3 = Some days (1–3 days/week), 4 = Most days (4–6 days/week), 5 = Every day, 6 = Many times each day)._

    A summary score is calculated when responses are available for at least 9 of 17 items at V03 and 20 of 40 items at V05.
    If fewer items are completed, the score is recorded as missing. When some items are missing, but the minimum number has been answered, a prorated score is calculated:

    **_Prorated Score_**_ = (Sum of answered items ÷ Number of answered items) × Total number of items_
  all_warnings_collapsed: |2-

    The MAPS-TL assesses normative variations in child behavior and should be interpreted within the context of the child's age and developmental stage. This is not clinical or diagnostic instrument.
