    Scherf, K. S., & Scott, L. S. (2012). Connecting developmental trajectories: Biases in face processing from infancy to adulthood. _Developmental Psychobiology_, 54(6), 643–663. <https://doi.org/10.1002/dev.21013>'
  respondent_category: Child on Self
  README URL: https://docs.hbcdstudy.org/latest/instruments/eeg/tasks/#faces-task
