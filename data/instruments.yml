  description: The **Transitions in Care (TIC) Screener** captures children’s transitions to formal and informal non-parental care at each timepoint starting with Visit 2. It is designed to capture children’s formal and informal transitions to non-parental care, including living in foster care, kinship care, and other non-parental care arrangements, either temporary or permanent. The TIC Screener is completed by a research assistant (RA) at each site at the time of scheduling a participant, usually based on phone calls. Information can be entered into the profile of the child, original consented parent, and/or alternate caregiver.
