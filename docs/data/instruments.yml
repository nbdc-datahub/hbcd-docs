  administration: In-person
  scoring: |-
    ### Scoring and Clinical Alert Criteria

    The eHITS summary score is calculated as the sum of all item responses. Published versions of the instrument use different score ranges and screening thresholds for intimate partner violence (IPV):

    - **Sherin et al. (1998)**
        - Score range: **4–20**
        - Published IPV cutoff: **>10.5**
    - **Chan et al. (2010)**
        - Score range: **5–25**
        - Published IPV cutoff: **>8.5**
    - **HBCD (2024)**
        - Score range: **0–20**
        - Published IPV cutoff: **>3.5**

    ### HBCD Clinical Alert

    Within HBCD, a clinical alert for IPV is generated when the participant's summary score is **greater than 7**, _or_ when either of the following items receives a response greater than 0: "_...physically hurt you?" and/or "...forced you to engage in sexual activity?". _If one or more items are answered _Don't know_, a clinical alert may not be generated even if the participant's true responses would otherwise meet the alert criteria.
