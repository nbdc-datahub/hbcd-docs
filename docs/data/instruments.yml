  release: '2.1'
  qc: |-
    - Examine missingness by counting items answered per participant.
    - Check age is within expected ranges.
    - Review summary statistics and visualizations (item frequencies, age, prorated scores).
  administration: Remote
  scoring: "The Self-Regulation scale includes 5 items each rated on a 5-point scale (_1 = Never; 2 = Rarely; 3 = Sometimes; 4 = Often; 5 = Always). Responses _of \"Decline to Answer\" are treated as missing. A total score is only calculated when **at least 3 of 5 items** are answered and otherwise will be missing. If all 5 items are completed, the total score is the sum of the item scores. If 1 or 2 items are missing, a prorated score is calculated as follows: \n\n**_Prorated Score_**_ = (Sum of answered items ÷ Number of answered items) × 5_"
  all_warnings_collapsed: null
  resources: null
  measure: ecPROMIS Self-Regulation - Flexibility Scale
  construct: Self-Regulation and Flexibility
