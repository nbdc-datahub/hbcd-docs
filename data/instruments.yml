  scoring: "##### General Scoring Description\n\nThe PedsQL is scored in 4 domains:\n\n- Physical Functioning\n- Emotional functioning\n- Social Functioning\n- School Functioning\n\n \n\n##### Scoring Procedure\n\nItems are reverse scored and linearly transformed to a 0-100 scale as follows: 0=100, 1=75, 2=50, 3=25, 4=0. If more than 50% of the items in the scale are missing, the scale scores should not be computed.\n\n- Mean score = Sum of the items over the number of items answered\n- Psychosocial Health Summary Score = Sum of the items over the number of items answered in the Emotional, Social, and School Functioning Scales  \n- Physical Health Summary Score = Physical Functioning Scale Score \n- Total Score: Sum of all the items over the number of items answered on all the Scales\n\n##### Missing data\n\nIf more than 50% of the items in the scale are missing, the Scale Scores are not and should not be computed. If 50% or more items are completed: the mean of the completed items in a\
    \ scare are imputed."
