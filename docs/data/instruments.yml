  visits: V04
  hbcd_mods3: Modifications were made to accommodate Spanish-speaking households. English instructions were translated by experienced Bayley assessors accustomed to administering the BSID-4 in Spanish contexts for infants. The HBCD Spanish Language Committee reviewed translations, resolving discrepancies through iterative discussion. For families opting for Spanish administration, RAs used the approved HBCD Spanish translations of both instructions and caregiver questions. No modifications were made to the scoring of the responses and computation of the associated cluster and standard scores.
  primary_data_type: Tabulated data
  acronym: Bayley-4
  hbcd_mods_collapsed: |-
    Administration
    The test was designed to be administered by trained clinicians. For the HBCD Study, however, administration was performed primarily by trained Research Assistants (RAs). HBCD implemented a rigorous training and certification process to ensure that all RAs met study-wide standards before conducting assessments. For training, subject matter experts (licensed psychologists with expertise in infant testing and BSID-4 administration) provided lectures, group discussions, and office hours for individualized guidance. To be certified, RAs were required to submit both a recorded administration and their QGlobal item-level scoring for expert review.

    Use of Caregiver Questions
    The use of Caregiver Questions on the BSID-4 was modified. RAs were instructed to query the caregiver if the child scored below a 2 on items where caregiver input is permitted to inform the assessment. The BSID-4 manual specifies using caregiver reports when the target behavior “has not been observed.” It also notes that caregiver questions were used in 95% of administrations in the normative sample, with no formal limit on their use. The manual indicates that the assessment’s validity may be questioned if there are frequent discrepancies between what is observed and what is reported.

    Accommodations For Spanish-Speaking Households
    Modifications were made to accommodate Spanish-speaking households. English instructions were translated by experienced Bayley assessors accustomed to administering the BSID-4 in Spanish contexts for infants. The HBCD Spanish Language Committee reviewed translations, resolving discrepancies through iterative discussion. For families opting for Spanish administration, RAs used the approved HBCD Spanish translations of both instructions and caregiver questions. No modifications were made to the scoring of the responses and computation of the associated cluster and standard scores.
  Form Link: https://form.fillout.com/t/qaNxHYsnPBus?id=recOfvzHWYKX64ErY
  warning1: A subset of participants are missing the Bayley-4 records, i.e. the <b>Administration</b> field (<code>ncl_ch_bayley_administration</code>) has a value of 'None.' However, there are a variety of reasons why the data may be missing, therefore a value of 'None' does not mean that the Bayley was not administered. These data will be added in future releases as it becomes available.
  description: The **Bayley Scales of Infant and Toddler Development, Fourth Edition**, is an established, commercially available measure of early development. The test provides an estimate of the child's cognitive, language, and motor skills. The **Language Domain** evaluates both receptive and expressive communication skills. The **Motor Domain** evaluates both fine and gross motor skills. The **Social-Emotional** and **Adaptive Behavior** Scales of the Bayley-4 were not administered in this study. Publisher documentation for the Bayley-4 is available [here](https://www.pearsonassessments.com/en-us/Store/Professional-Assessments/Cognition-%26-Neuro/Bayley-Scales-of-Infant-and-Toddler-Development-%7C-Fourth-Edition/p/100001996).
  slug: bayley-scales-of-infant-and-toddler-development-fourth-edition
  hbcd_mods3_title: Accommodations For Spanish-Speaking Households
  domain: Neurocognition & Language
  release: '2.1'
  qc: |-
    - HBCD Study staff were trained and certified by experienced Bayley administrators to ensure adherence to standardized procedures.
    - During testing, responses were entered into QGlobal (Pearson’s official scoring platform for the Bayley Scales), which automatically applied scoring rules and generated standardized scores.
    - Data underwent quality checks at both the individual and cohort levels, including range and consistency checks, to identify potential errors or deviations.
    - Completion rates were monitored across sites, with additional training provided when needed.
  administration: In-person
  scoring: Bayley scores are generated automatically using QGlobal, Pearson’s official scoring platform for the Bayley Scales. Scores reflect the standardized scoring procedures implemented by Pearson, and no additional manual scoring or modification is applied.
  all_warnings_collapsed: |-
    Missing Records
    A subset of participants are missing the Bayley-4 records, i.e. the <b>Administration</b> field (<code>ncl_ch_bayley_administration</code>) has a value of 'None.' However, there are a variety of reasons why the data may be missing, therefore a value of 'None' does not mean that the Bayley was not administered. These data will be added in future releases as it becomes available.

    Limited Predictive Validity for Long-Term Neurocognitive Status
    Although the Bayley Scales of Infant and Toddler Development, Fourth Edition, is a well-established and validated measure of infant development, tests of this nature have historically had limited predictive validity for long-term neurocognitive status.
  hbcd_mods1_title: Administration
  measure: Bayley Scales of Infant and Toddler Development, Fourth Edition
  construct: Child Development (Cognitive, Language, and Motor)
assist:
  status: Form Complete
  alert1: |-
    Responsible use of prenatal drug exposure data requires thoughtful interpretation of exposure-related outcomes in the context of measured and unmeasured confounders. These confounders include, but are not limited to, phenotypic risks associated with persistent alcohol, tobacco, and other drug use during pregnancy by birthing parents ([Massey et al., 2010](https://doi.org/10.1111/j.1521-0391.2010.00110.x)), and confounding by familial risk from within-family studies ([Estabrook et al., 2016](https://doi.org/10.1007/s10519-015-9762-2)).

    Finally, unwarranted speculation about ‘neural bases of behavior’ form differences in neuroimaging between exposed and unexposed children in the absence of differences in behavioral performance can exacerbate stigma already faced by birthing parents with substance use disorders and their children ([McAllister & Hart 2015](https://doi.org/10.1016/j.ntt.2015.07.002)).
  hbcd_mods2_title: Replacement Questions for NIDA Quick Screen
  hbcd_mods1: Unlike the original NIDA Modified ASSIST, the HBCD adaptation is **not scored**. When describing these measures in publications, authors may note that the instrument was adapted from the NIDA Modified ASSIST.
  alert1_title: V1 & V2
  duration: 3-5 min
  hbcd_mods2: |-
    ##### ASSIST V1

    **Lifetime (`lt__use`) substance use and disordered use, 3 months pre-pregnancy (`pre_use`), and during pregnancy (`during_use`)**

    - `[lt__use] `IN YOUR LIFE, which of the following substances have you EVER used for any reason?
    - `[lt__concern]` Have you EVER been concerned about your use of this substance or worried it was problematic use?
    - `[lt__concernoth]` Has a friend, relative, or anyone else EVER expressed concern about your use of this substance?
    - `[control]` Have you EVER tried and failed to control, cut down, or stop using this substance?
    - `[tx]` Have you EVER sought or received treatment related to your use of this substance by a medical provider, spiritual leader, community mutual help group (like AA or SMART Recovery), counselors, or in other settings?
    - `[diagn]` Have you EVER been clinically diagnosed with abuse, dependence, or a substance use disorder related to your use of this substance?
    - `[med]` Have you EVER taken (prescribed or otherwise) medication(s) as treatment for a problem substance?
    - `[pre_use]` IN THE THREE MONTHS BEFORE YOU BECAME PREGNANT, which of the following substances have you ever used for any reason?
    - `[during_use]` DURING YOUR PREGNANCY, which of the following substances have you ever used for any reason?
    - `[during_med]` DURING YOUR PREGNANCY, did you take (prescribed or otherwise) medication(s) as treatment for a problem substance?

    ##### ASSIST V2

    **Use after pregnancy**

    - `[end_use]` SINCE WE LAST MET UNTIL THE END OF PREGNANCY, which of the following substances did you use for any reason?
    - `[end_med] `SINCE WE LAST MET UNTIL THE END OF PREGNANCY, did you take (prescribed or otherwise) medication(s) as treatment for a problem substance?
    - `[post_use] `FROM THE TIME THAT YOU DELIVERED your child until now, how often have you used any of the following substances for any reason?

    ##### ASSIST V3

    **Substance use in past 3 months and impact after pregnancy**

    - `[3m_use]` IN THE PAST THREE MONTHS, how often have you used any of the following substances for any reason?
    - `[problem]` DURING THE PAST THREE MONTHS, has your use of this substance led to physical or mental health, social, or financial problems?
    - `[perform]` DURING THE PAST THREE MONTHS, have you ever failed to do what was normally expected of you (like work, go to school, be a parent, or household tasks) because of your use of this substance?

    ##### ASSIST V4

    **Substance use in past 12 months and impact after pregnancy**

    - `[12m_use]` IN THE PAST TWELVE MONTHS, how often have you used any of the following substances for any reason?
    - `[problem]` DURING THE PAST TWELVE MONTHS, has your use of this substance led to physical or mental health, social, or financial problems?
    - `[perform]` DURING THE PAST TWELVE MONTHS, have you ever failed to do what was normally expected of you (like work, go to school, be a parent, or household tasks) because of your use of this substance?
