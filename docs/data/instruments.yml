    Trujillo-Priego, I. A., Zhou, J., Werner, I. F., Deng, W., & Smith, B. A. (2020). Infant leg activity intensity before and after naps. _Journal for the Measurement of Physical Behaviour_, 3(2), 157–163.<https://doi.org/10.1123/jmpb.2019-0011>
