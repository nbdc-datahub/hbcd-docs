site_name: HBCD Data Release Docs
site_url: https://docs.hbcdstudy.org/latest/

use_directory_urls: true

theme:
  name: readthedocs
 
markdown_extensions:
  - toc:
      permalink: '🔗'  
      toc_depth: 6  # Include headers 1 - 6
  - pymdownx.arithmatex
  - pymdownx.snippets
  - md_in_html # allows you to add markdown within html blocks and still render correctly

extra_javascript:
  - js/extra.js
  - js/ga.js
  - js/gridsearch.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://www.googletagmanager.com/gtag/js?id=G-BY0EH2K1YQ

# extra:
#   analytics:
#     provider: google
#     property: G-BY0EH2K1YQ

extra_css:
  - css/custom.css
  - css/banners.css
  - css/tables.css
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css
  - https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css

plugins:
  - search
  - macros 
  - include-markdown
  - git-revision-date-localized:
      type: date

docs_dir: docs

