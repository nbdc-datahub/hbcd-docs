  alert1: When using HBCD data, all data users must agree to responsible use as described in the DUC. When conceptualizing studies, analyzing data, and communicating findings from studies that use variables such as race, ethnicity, country of origin, and socioeconomic data, it is critical to consider strategies to avoid stigmatization of any groups and perpetuating harmful biases.
  warning3_title: Branching Logic
  hbcd_mods1: "Below are alterations made to demographic constructs to tailor it to the HBCD Study. The modifications were made to reduce bias and capture a more inclusive and accurate breadth of demographic information, e.g., by correcting for embedded assumptions of heteronormative nuclear-family structures. \n\n- **Marital & Relationship Status** alterations to reduce heteronormative bias: Combine \"Divorced/Separated\", \"Never Married\" replaced by \"Single,\" and \"Member of an Unmarried Couple\" replaced by \"Partnered\"\n- **Primary Residence** destigmatization of living situations: Inclusion of options for individuals in treatment facilities, shelters, or unhoused.\n- **Household Roster** alteration to reduce nuclear family assumptions: expansion of family/caregiver roles\n- **Race/Ethnicity** and **Others Describe You**: Inclusion of racial and ethnic categories aligned with proposed OMB recommendations using a combined race and ethnicity variable with 7 response options ([Federal\
    \ Register 2023](https://www.federalregister.gov/documents/2023/01/27/2023-01635/initial-proposals-for-updating-ombs-race-and-ethnicity-statistical-standards)). Participant select all that apply.\n- **Income**: Alteration of household income brackets."
