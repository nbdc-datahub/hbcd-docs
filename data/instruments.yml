chaos:
  status: README updated & ready for SME review
  alert1: null
  hbcd_mods1: The original CHAOS used True/False responses ([Matheny et al., 1995](https://doi.org/10.1016/0193-3973(95)90028-4)), but more recent work favors a 4-point Likert scale for improved sensitivity ([Wilhoit et al., 2021](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8680262/)). Empirical results suggest consistent scale validity and associations (with child cognitive/behavioral outcomes, parenting, etc.) across both formats ([Andrews et al., 2021](https://bmcpsychology.biomedcentral.com/articles/10.1186/s40359-021-00651-1); [Marsh et al., 2020](https://doi.org/10.1186/s12889-020-08587-8)). The 4-point scale is also validated in the Spanish language version of CHAOS as well ([Sanchez-Mondragon & Flores Herrera, 2019](https://doi.org/10.15174/au.2019.1971)).
  duration: 4-8 min
  hbcd_mods2: null
  full_name: Confusion, Hubbub and Order Scale
  warning4: null
  alert2: null
  assessment_type: Questionnaire
  table_name: mh_cg_chaos
  warning2: null
  references: 'Andrews, K., Dunn, J. R., Prime, H., Duku, E., Atkinson, L., Tiwari, A., & Gonzalez, A. (2021). Effects of household chaos and parental responsiveness on child executive functions: a novel, multi-method approach. _BMC Psychology_, 9(1), 147. <https://doi.org/10.1186/s40359-021-00651-1>

    Edwards, R. C., Planalp, E. M., Bosquet-Enlow, M., Akshoomoff, N., Bodison, S. C., Brennan, M. B., Ciciolla, L., Eiden, R. D., Fillipi, C. A., Gustafsson, H. C., McKelvey, L. M., Morris, A. S., Peralta-Carcelén, M., Poehlmann, J., Wakschlag, L. S., Wilson, S., & HBCD Child Behavior and Caregiver-Child Interaction Workgroup. (2024). Capturing the complexity of child behavior and caregiver-child relationships in the HEALthy Brain and Child Development (HBCD) Study using a rigorous and equitable approach. _Developmental Cognitive Neuroscience_, 69, 101422. <https://doi.org/10.1016/j.dcn.2024.101422>

    Marsh, S., Dobson, R., & Maddison, R. (2020). The relationship between household chaos and child, parent, and family outcomes: a systematic scoping review. _BMC Public Health_, 20(1), 513. <https://doi.org/10.1186/s12889-020-08587-8>

    Matheny, A. P., Jr, Wachs, T. D., Ludwig, J. L., & Phillips, K. (1995). Bringing order out of chaos: Psychometric characteristics of the confusion, hubbub, and order scale. _Journal of Applied Developmental Psychology_, 16(3), 429–444. <https://doi.org/10.1016/0193-3973(95)90028-4>

    Sánchez-Mondragón, G., & Flores Herrera, L. M. (2019). Adaptation and validation of Confusion, Hubbub, and Order Scale in Mexican parents. _Acta Universitaria_, 29, 1–13. <https://doi.org/10.15174/au.2019.1971>

    Wilhoit, S. A., Trentacosta, C. J., Beeghly, M., Boeve, J. L., Lewis, T. L., & Thomason, M. E. (2021). Household chaos and early childhood behavior problems: The moderating role of mother-child reciprocity in lower-income families. _Family Relations_, 70(4), 1040–1054. <https://doi.org/10.1111/fare.12560>'
  respondent_category: Parent on Child
  admin_notes: None
  README URL: https://docs.hbcdstudy.org/latest/instruments/bcgi/chaos/
  visits: V05, V07
  hbcd_mods3: null
  primary_data_type: Tabulated data
  alert4: null
  acronym: CHAOS
  warning3: null
  alert4_title: null
  Form Link: https://form.fillout.com/t/qaNxHYsnPBus?id=recBHSDBI2bdSSaTw
  warning1: null
  description: 'The **Confusion, Hubbub, and Order Scale (CHAOS)** is a 15-item, self-report scale designed to assess household chaos conceptualized as disorganization, disruption, and a chaotic atmosphere ([Matheny et al., 1995](https://doi.org/10.1016/0193-3973(95)90028-4); [Wilhoit et al., 2021](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8680262/)). The CHAOS is intended to measure two facets of household chaos: 1. routines and organization; 2. disorganization, confusion, and noise. It does not assess other features that have been linked to household chaos, such as shifting family structure or housing instability.'
  slug: confusion-hubbub-and-order-scale
  domain: Behavior & Caregiver-Child Interactions
  release: '2.1'
  qc: '- Assess missingness (items completed per participant).

    - Verify scoring accuracy.

    - Review summary statistics (item frequencies, total scores).

    - Inspect response distributions for outliers.'
  administration: Remote
  scoring: "The 15 CHAOS items are rated on a 4-point scale: _1 = Very much, 2 = Somewhat, 3 = A little bit, 4 = Not at all_ (like your own home). \"_Decline to Answer_\" is available and is not scored. \n\nThe **total score** is calculated as the sum of all numerical item responses, excluding non-responses. Higher scores indicate a higher level of household CHAOS. Note that the following items are reverse-scored 1→4, 2→3, 3→2, 4→1): `chaos_003`, `chaos_005`, `chaos_006`, `chaos_008`, `chaos_009`, `chaos_010`, `chaos_011`, `chaos_013` (remaining items are scored as coded).\n\nIf fewer than 12 items are completed (or 4 or more items are missing), a total score is not computed. If less than 25% of items are missing (≤3 items), a prorated sum score is calculated using the formula:\n\n**_Prorated score_**_ = (Sum of answered items / Number of items answered) * 15_"
  resources: null
  measure: Confusion, Hubbub and Order Scale
  construct: Family Organization
ptsd:
  status: README updated & ready for SME review
  alert1: The co-occurrence of psychiatric symptoms and substance use during pregnancy is well-documented ([Massey et al., 2011](https://doi.org/10.1111/j.1521-0391.2010.00110.x), [Massey et al., 2012](https://doi.org/10.1016/j.addbeh.2012.04.002)). Phenotypic risk in birthing parents may affect offspring neurodevelopment through both prenatal and postnatal mechanisms, beyond direct exposure alone ([Estabrook et al., 2016](https://doi.org/10.1007/s10519-015-9762-2), [Massey et al., 2016](https://doi.org/10.1016/j.ntt.2015.11.010), [Massey et al., 2018](https://doi.org/10.1016/j.ntt.2018.02.003)). These factors may confound associations between exposures and neuroimaging or neurodevelopmental outcomes, but they also represent malleable targets for prevention and early intervention. When possible, incorporating parental mental health symptoms as covariates offers a robust strategy to account for these confounding influences.
  hbcd_mods1: In the HBCD study, a ‘Decline to answer’ option was added to all items. A ‘Don’t know’ option was also available early in data collection, but was later removed.
  alert1_title: Consideration of Mental Health Symptoms Experienced During Pregnancy
  duration: 3 min
  hbcd_mods2: null
  full_name: TEST/DUMMY FORM (copy of National Stressful Events Survey- PTSD Short Scale/Acute Stress Disorder)
  assessment_type: Questionnaire
  table_name: pex_bm_str__ptsd
  references: 'Estabrook, R., Massey, S. H., Clark, C. A. C., Burns, J. L., Mustanski, B. S., Cook, E. H., O’Brien, T. C., Makowski, B., Espy, K. A., & Wakschlag, L. S. (2016). Separating family-level and direct exposure effects of smoking during pregnancy on offspring externalizing symptoms: Bridging the behavior genetic and behavior teratologic divide. Behavior Genetics, 46(3), 389–402. <https://doi.org/10.1007/s10519-015-9762-2>

    Massey, S. H., Lieberman, D. Z., Reiss, D., Leve, L. D., Shaw, D. S., & Neiderhiser, J. M. (2011). Association of clinical characteristics and cessation of tobacco, alcohol, and illicit drug use during pregnancy. The American Journal on Addictions. <https://doi.org/10.1111/j.1521-0391.2010.00110.x>

    Massey, S. H., Mroczek, D. K., Burns, J. L., Clark, C. A. C., Espy, K. A., & Wakschlag, L. S. (2018). Positive parenting behaviors in women who spontaneously quit smoking during pregnancy: Clues to putative targets for preventive interventions. Neurotoxicology and Teratology, 67, 18–24.<https://doi.org/10.1016/j.ntt.2018.02.003>

    Massey, S. H., Neiderhiser, J. M., Shaw, D. S., Leve, L. D., Ganiban, J. M., & Reiss, D. (2012). Maternal self concept as a provider and cessation of substance use during pregnancy. Addictive Behaviors, 37(8), 956–961. <https://doi.org/10.1016/j.addbeh.2012.04.002>

    Massey, S. H., Reiss, D., Neiderhiser, J. M., Leve, L. D., Shaw, D. S., & Ganiban, J. M. (2016). Maternal personality traits associated with patterns of prenatal smoking and exposure: Implications for etiologic and prevention research. Neurotoxicology and Teratology, 53, 48–54. <https://doi.org/10.1016/j.ntt.2015.11.010>'
  respondent_category: Parent on Self
  admin_notes: THIS FORM IS NOT ACTUALLY USED - it's just a copy of the original instrument form to share for demonstration
