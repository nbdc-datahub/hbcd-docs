  description: "**EEG Acquisition Flags for V03, V04, V06**    \n  \n     \n  \n- `Bgin` — Start of task   \n- `Stm+` — FACE stimuli presentation  \n- `ITI+` — Inter-trial time  \n- `fix+` — Fixation cross presentation (between faces)   \n- `dist` — Distractor/attention grabber   \n- `DIN3` — StimTracker flag for visual stimuli   \n- `TRSP` — End of stimulus presentation, contains additional stimulus information (what face was shown)  \n  \nThe Faces task (**FACE**) (v.11.29.23) assesses child and infant face processing abilities as well as the underlying neural activity supporting face and object processing. ERPs are computed as a function of repeated presentation of faces and objects. The ERPs index different stages of processing including attention, perception, categorization, individuation and memory. The ERP components elicited by the Faces task are the P1, N290, and P400 components.\n\n### FACE Protocol Summary \n\nERPs indexing different stages of face processing are computed from\
    \ repeated presentations of faces and objects. In the Face task, the primary ERP components are **P1, N290, and P400**. If the child loses attention during the task, an attention-getter may be presented. The stimulus set includes 36 unique images of women with neutral expressions representing the following self-identified demographics: Indigenous, Black, White, Asian, Hispanic/Latina, and South Asian. \n\n- **The task consists of two blocks **(Tabular EEG variable names shown in `code`):\n    - **Block 1**: 50 trials of upright faces (`uprightInv`) & 50 trials of inverted faces (`Inv`)\n    - **Block 2**: 50 trials of upright faces (`uprightObj`) & 50 trials of objects (`Obj`)\n- **Timing Details:**\n    - **Stimulus duration:** 500 ms\n    - **Interstimulus interval:** 600–700 ms\n    - **Total trial length:** 110–1200 ms\n\n<img src=\"../images/eeg-facetask.png\" alt=\"Visual of FACES task presentations\" class=\"center\">"
