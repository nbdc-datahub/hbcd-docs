  warning1: Raw BIDS data are released for all collected EEG sessions, regardless of processing eligibility. Therefore, **differences in session counts between raw BIDS and HBCD-MADE derivatives are expected.** In addition to exclusion based on quality control, ~2% of sessions had technical or acquisition issues that prevented complete processing. These data may be made available in future releases as issues are resolved.
  description: 'The HBCD study includes four electroencephalography (EEG) tasks collected during visits V03, V04, and V06: Auditory Mismatch Negativity (MMN), Faces (FACE), Video Resting State (RS), and Visual Evoked Potential (VEP). See [HBCD EEG Tasks](http://127.0.0.1:8000/instruments/eeg/tasks/) for detailed descriptions of each task. **EEG protocols** are described in detail in [Fox et al. 2024](https://doi.org/10.1016/j.dcn.2024.101447) and fully documented in [HBCD EEG Acquisition Protocol](https://zenodo.org/records/14795030).'
  slug: eeg-main
  supp3_text: null
  domain: EEG
  release: '2.1'
  qc: "## QC Dashbboard\n\nAfter EEG acquisition, quality control checks are performed using [EEG2BIDS Wizard](https://github.com/aces/eeg2bids), a custom MATLAB application installed at all HBCD sites. These checks are immediately provided to the user to ensure the data's integrity and usability. The process includes:    \n\n- Verifying event markers in the EEG data to confirm all required events are accurately recorded.   \n- Ensuring the setup for stimulus presentation and EEG data acquisition adheres to the study protocol.   \n- Inspecting electrode impedances to ensure they are within acceptable limits.   \n- Detecting multiple task runs and incomplete recordings.   \n- Confirming the use of correct E-Prime task versions.    \n  \n     \n  \nBoth study sites and the EEG Core team use an EEG Quality Control dashboard developed by LORIS to access and monitor incoming EEG data and QC metrics, such as retained epochs and line noise levels. Outputs from the HBCD-Maryland Analysis of Developmental\
    \ EEG ([HBCD-MADE](https://hbcd-made.readthedocs.io/en/latest/)) pipeline, which handles preprocessing and data cleaning, are also integrated into the dashboard. These outputs include key metrics like outlier statistics for specific task epochs ([Debnath et al., 2020](https://doi.org/10.1111/psyp.13580)). Regular site-specific check-ins and troubleshooting are conducted to ensure consistent protocol adherence and data quality across sites. For a detailed description of QC procedures in the HBCD Study EEG protocol, refer to [Fox et al., 2024](https://doi.org/10.1016/j.dcn.2024.101447).    \n  \n     \n  \nDuring quality control, a frequently observed issue across all tasks was the irregular application of EEG sensors. Additionally, partial task completion due to infant fussing and missing stimulus flags were commonly noted for the faces and auditory mismatch negativity tasks.    \n     \n\n## StimTracker Artifact Detection\n\n**NOTE: Presence of the StimTracker artifact is listed in the\
    \ tabulated QC file for each task (**`eeg_qc_task-<TASK>`**).**     \n  \n     \n  \nThe **StimTracker** device used during EEG acquisition for visits V03, V04, and V06 provides precise timing for auditory and visual stimulus onset and marks task start and end points. It inserts flags in the VEP, FACE, and MMN tasks and does not insert flags in RS. The EEG Core identified an **electrical artifact** in a subset of files caused by intermittent spikes from the device at both stimulus onset and offset.   \n\n \n\n<img src=\"https://github.com/nbdc-datahub/hbcd-docs/raw/main/docs/instruments/eeg/images/Fig1.png\" alt=\"Stimtracker artifact example\" width=\"600\" height=\"auto\" class=\"center\">    \n  \nTo detect the artifact, the EEG Core developed a custom MATLAB script (`stimtracker_artifact_interpolation.m`) that averages all epochs per task and flags voltage fluctuations >1 µV in two time windows: –10 to 10 ms and 250 to 270 ms of the voltage spike. This script also applies a linear\
    \ interpolation correction to all files containing DINs, regardless of whether the artifact is present. Task-level visualizations of the linear interpolation are plotted in _filename.png_. Flagged files in the raw EEG data (40–50%) were visually inspected after preprocessing with the MADE pipeline by examining all channels averaged across all trials. If the artifact was still visible, the file was labeled as artifact-present. If it was no longer visible, the file was labeled as artifact-free, indicating adequate artifact removal. **After preprocessing, ~10% of V03 files retained the StimTracker artifact.**    \n  \nTo evaluate the impact of the StimTracker artifact on EEG derivatives, event-related potentials (ERPs) were generated for relevant regions and time windows - see [Effects of Artifact on ERP Derivatives by Task](https://docs.hbcdstudy.org/2.1/instruments/eeg/artifact/) for details and figures displaying artifact-free and artifact-present waveforms across tasks and ROIs. Statistical\
    \ comparisons of mean ERP component amplitudes between artifact-free and artifact-present files across tasks revealed only two significant differences, both in the T7T8 cluster for the standard and deviant conditions of the MMN after FDR correction. Difference waves (Predeviant–Deviant) showed no significant effects for the FCz or T7T8 clusters, and no significant differences were found in the VEP or FACEs tasks.    \n  \nIn sum, our analysis indicates that the **StimTracker artifact does not meaningfully affect mean ERP amplitudes** and has minimal impact on the released derivatives. However, we encourage users to assess potential effects in their own analyses. The presence of the artifact is provided in the task-specific `eeg_qc_task-<TASK>` files included as part of the [tabulated EEG data](https://docs.hbcdstudy.org/2.1/instruments/#eeg). The eeg_qc_task-<TASK>_Stimtracker_Artifact_present variable indicates whether the artifact was present (yes/no) in the processed data. The eeg_qc_task-<TASK>_StimTracker_Artifact_fixed\
    \ variable indicates whether linear interpolation was applied.   \n  \n**_See [Effects of Artifact on ERP Derivatives by Task](https://docs.hbcdstudy.org/2.1/instruments/eeg/artifact/) for more information about the StimTracker artifact._**    \n  \n     \n\n## EEG Net Placement ('Capping Quality') Ratings   \n\n**_NOTE: Capping ratings are available in the tabulated QC file for each task (`eeg_qc_task-<TASK>_capping_quality`_).**    \n  \n     \n  \nEEG capping quality ratings are used to determine inclusion in data processing. Photos used to assess EEG capping quality are taken for each acquisition from the front, back, top, left, and right angles of the participant's head and uploaded via the BIDS Wizard application to a secure computing environment. They are then reviewed by the EEG Core at the University of Maryland to rate the quality of EEG net placement, or \"capping quality,\" for each acquisition.    \n  \n- **Markers of Proper Net Placement**       \n    - Reference electrode\
    \ (REF) at the vertex       \n    - Nasion electrode (#17) between the eyebrows       \n    - Ear electrodes (#44 and #114) at the preauricular points   \n  \n- **Net Placement Rubric**       \n    - **Excellent:** All markers are within 0–0.5 cm of the correct placement.       \n    - **Average:** Any marker is 0.5–2 cm from the correct placement.       \n    - **Poor:** Any marker is 2–3 cm from the correct placement.       \n    - **Very Poor:** Any marker is more than 3 cm from the correct placement.    \n  \nPlease refer to the [HBCD EEG Acquisition Protocol](https://zenodo.org/records/14795030) for additional information about capping requirements."
  administration: In-person
  scoring: null
  all_warnings_collapsed: |-
    Expected Differences Between Raw BIDS and Derivatives
    Raw BIDS data are released for all collected EEG sessions, regardless of processing eligibility. Therefore, differences in session counts between raw BIDS and HBCD-MADE derivatives are expected. In addition to exclusion based on quality control, ~2% of sessions had technical or acquisition issues that prevented complete processing. These data may be made available in future releases as issues are resolved.

    Stimtracker Artifact
    The MMN, VEP, and FACE task data may contain an artifact originating from the StimTracker device used for stimulus timing - see more information on this here.

    MMN: Change in ISI Between Visits
    The interstimulus interval (ISI) for the Auditory Mismatch Negativity task changed between visits V03 and V04/V06 - see Fox et al. 2024 and Morr et al. 2002 for details.

    RS: Change in Video Content Between Visits
    The video content for the Resting State task changed between visits V03 and V04/V06 - see Fox et al. 2024 and Morr et al. 2002 for details. Also note that RS is not a true resting state as there is a visual stimulus present.
  resources: null
  warning4_title: 'RS: Change in Video Content Between Visits'
  supp1_text: |-
    ## File Selection For Processing

    Not all raw EEG sessions are eligible for processing. Inclusion in the HBCD-MADE pipeline requires that sessions meet predefined [quality control](http://127.0.0.1:8000/instruments/eeg/qc/#eeg-net-placement-capping-quality-ratings) criteria. Common causes of exclusion include missing EEG capping images or very poor capping quality. For participants with multiple EEG acquisition attempts within a session, **only the final run was processed and included in the MADE derivatives.**

    ## Data Processing

    EEG data were processed using **[HBCD-MADE](https://docs-hbcd-made.readthedocs.io/)**, an adaptation of the Maryland Analysis of Developmental EEG (MADE) pipeline ([Debnath et al., 2020](https://doi.org/10.1111/psyp.13580)) developed specifically for the HBCD Study. HBCD-MADE is implemented as a containerized BIDS App that adheres to HBCD [Processing & Derivative Data Standards](https://docs.hbcdstudy.org/2.1/standards/processing/standards/). Full documentation of processing parameters, pipeline configuration, and file selection logic is available at the official [HBCD-MADE documentation site](https://docs-hbcd-made.readthedocs.io/) and external [HBCD Processing website](https://hbcd-cbrain-processing.readthedocs.io/release_2.0/tools/made.html).
