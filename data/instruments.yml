  description: |-
    Datasets within the Demographics domain are intended to provide HBCD investigators with a concise set of commonly used variables without requiring users to navigate multiple source files. The Static Table is a **derived measure** with information computed from the following sources:

    - **Administrative screening records** collected by HBCD Study staff, as reported by the birth parent, during the enrolment/screening process (e.g. the age and race/ethnicity of the pregnant study participant)
    - **Demographics instruments** (Social & Environmental Determinants), including Adult and Child (`sed_{bm|ch}_demo`)

    Static data include global, visit-agnostic variables that do not change over time and should be consistent across all visits for the adult/caregiver and beginning at Visit 2 for the child (post-birth). Note that if the release includes only V01 data for a given adult participant (due to ongoing enrollment, participant withdrawal, etc.), items about their child will be missing, as the child is not born until after the V01 visit.
  slug: static-table
  supp3_text: |-
    ## Race & Ethnicity - All of US

    A second set of race and ethnicity variables are computed from a single All of Us ([AOU](https://support.researchallofus.org/hc/en-us/articles/360039299632-Race-and-ethnicity-generalizations)) race/ethnicity item collected as part of the [Demographics](https://docs.hbcdstudy.org/3.0/instruments/SED/demo-cg/) instrument. For AOU-derived variables, combined race and ethnicity variables are constructed following [OMB](https://www.federalregister.gov/documents/2023/01/27/2023-01635/initial-proposals-for-updating-ombs-race-and-ethnicity-statistical-standards) standards: Participants who identify as Hispanic/Latino (alone or with another group) are categorized as _Hispanic or Latino_; all others are categorized as non-Hispanic (_Non-Hispanic {Asian|Black|White}_).
