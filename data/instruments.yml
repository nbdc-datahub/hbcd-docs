    Krogh-Jespersen, S., MacNeill, L. A., Anderson, E. L., Stroup, H. E., Harriott, E. M., Gut, E., Blum, A., Fareedi, E., Fredian, K. M., Wert, S. L., Wakschlag, L. S., & Norton, E. S. (2021). Disruption leads to methodological and analytic innovation in developmental sciences: Recommendations for remote administration and dealing with messy data. _Frontiers in Psychology_, 12, 732312. <https://doi.org/10.3389/fpsyg.2021.732312>
    Edwards, R. C., Planalp, E. M., Bosquet Enlow, M., Akshoomoff, N., Bodison, S. C., Brennan, M. B., Ciciolla, L., Eiden, R. D., Fillipi, C. A., Gustafsson, H. C., McKelvey, L. M., Morris, A. S., Peralta-Carcelén, M., Poehlmann, J., Wakschlag, L. S., Wilson, S., & HBCD Child Behavior and Caregiver-Child Interactions Workgroup. (2024). Capturing the complexity of child behavior and caregiver-child interactions in the HEALthy Brain and Child Development (HBCD) Study using a rigorous and equitable approach. _Developmental Cognitive Neuroscience_, 69(101422), 101422.<https://doi.org/10.1016/j.dcn.2024.101422>
  respondent_category: Parent on Child
  admin_notes: This page includes a hard-coded table that cannot be updated via this form - contact Luci to update table if needed
  visits: V03
  hbcd_mods3: null
  primary_data_type: Tabulated data
  README:
    label: View
    url: null
  acronym: ERICA
  resource1_description: 'ERICA-inter-rater-reliability-2.1.csv file used to parse to create table under Coding Reliability Stats: https://docs.hbcdstudy.org/latest/instruments/bcgi/erica/#coding-reliability-statistics'
  warning3: The ERICA was administered in Spanish and English. The language of administration (i.e., language in which RAs delivered the instructions) does not always correspond with the language spoken by the caregiver/child during the activities. All videos in which the dyad speaks Spanish during the activities were coded by fully Spanish-English bilingual coders.
  Form Link: https://form.fillout.com/t/qaNxHYsnPBus?id=rec1WAh2tmcUCsPLU
  warning1: |-
    Prior to analysis, you must create a final integrated analytic dataset by merging the reliability codes (`mh_cg_erica_rel_3_9m`) into the primary coding data (`mh_cg_erica_3_9m`). **Failure to integrate these data correctly prior to analysis will result in incorrect results.** In future releases, this will not be necessary, as the integrated, analytic data set will be created prior to release. Download the following files:

    - [Integration Instructions](https://docs.hbcdstudy.org/latest/resources/ERICA_2.1_Integrated_Analytic_Data_INSTRUCTIONS.pdf)
    - [ERICA_2.1_Analytic_REMOVALS.csv](https://hbcd-docs-private.lassoinformatics.com/participant_lists/ERICA_2.1_Analytic_REMOVALS.csv) (in [HBCD Private Release Notes](https://hbcd-docs-private.lassoinformatics.com/)- DUC access required)
    - [ERICA_2.1_DataError_EXCLUSIONS.csv](https://hbcd-docs-private.lassoinformatics.com/participant_lists/ERICA_2.1_DataError_EXCLUSIONS.csv) (in [HBCD Private Release Notes](https://hbcd-docs-private.lassoinformatics.com)- DUC access required)
  description: "The Early Regulation in Context Assessment (**ERICA**) is a standardized observational paradigm that is adapted from the well-validated Disruptive Behavior Diagnostic Observation Schedule (DB-DOS) ([Krogh-Jespersen et al. 2022](https://doi.org/10.3389/fpsyg.2021.732312)). The ERICA assesses early child regulation in the context of the caregiver-child relationship via a series of five brief, developmentally appropriate activities that “press” for regulation within the dyad (e.g., frustration, engagement, enjoyment). The ERICA is coded using a one-pass, global coding system adapted for HBCD. Seven codes are organized across child, caregiver, and dyadic domains:\n\n- **Child:** Positive affect, Irritability, Social engagement\n- **Caregiver**: Responsive behavior, Irritable behavior, Directive behavior\n- **Dyadic**: Caregiver–child connectedness \n\nCodes are scored on a 4-point scale (0-3), reflecting the frequency, intensity, and duration of observed behaviors across the\
    \ paradigm, with higher scores indicating higher levels of observed behavior. See [Edwards et al. (2024)](https://doi.org/10.1016/j.dcn.2024.101422) for additional details on the ERICA paradigm and adaptation for HBCD."
  slug: early-regulation-in-context-assessment-r3-
  domain: Behavior & Caregiver-Child Interactions
  release: '3.0'
  qc: "**ERICA Site-Level Administration**\n\n- HBCD study staff were trained and certified by experienced ERICA administrators to ensure standardized administration procedures.\n- Ongoing administration quality was monitored through video review of at least 10% of administrations at each site, with additional reviews conducted for sites that did not meet fidelity benchmarks.\n- Completion rates were monitored, and site-level data on administration was reviewed for potential QC issues (e.g., frequent protocol interruptions or tech issues), with results informing additional site-level training and follow-up provided as needed. \n\n**Centralized Coding**\n\n- See [Centralized Coding of ERICA Videos](#centralized-coding-of-erica-videos) below for QC details"
  administration: In-person
  Form:
    label: Form Link
    url: https://form.fillout.com/t/qaNxHYsnPBus?id=rec1WAh2tmcUCsPLU
  resource1_url: https://github.com/nbdc-datahub/hbcd-docs/blob/main/docs/resources/tables/ERICA-inter-rater-reliability-2.1.csv
  scoring: |-
    Coders rate each construct at the activity level on a 4-point scale (None = 0, Low = 1, Medium = 2, High = 3). Activity-level ratings are then averaged across all activities to generate a continuous global score, ranging from 0-3, with higher scores reflecting higher levels of observed behavior.

    Modifiers (-1, +1, and +2) may be used with three codes (_child irritability, caregiver responsive behavior, and dyadic connectedness_) to capture important qualitative distinctions. For example, for child irritability, a **+1** is added at the activity level when a child is highly irritable throughout an entire activity, with no recovery or re-engagement and a **+2** is added if a child becomes intensely dysregulated during an activity (e.g., intense crying with breath holding, gagging, other indications of intense dysregulation). When used, modifiers are included in the sum for the global scores. For caregiver responsive behavior, a **-1** is added at the activity level when a caregiver does not responds at all to intense dysregulation in a child, is delayed in responding to child distress and this results in the child becoming intensely dysregulated, or is repeatedly doing things that are dysregulating to the child, resulting in the child becoming more and more distressed. For dyadic connectedness, a **-1** is added at the activity level, when a child is distressed through much of the activity without any ability to be soothed by the caregiver and distress is not resolved by the end of the activity or during the immediate re-engagement period when transitioning to the next activity.

    Modifiers are intended to weight the global score toward the higher or lower end of the 0-3 scale. When used, they are included in the sum for the global scores, however the scale is capped at 0-3, meaning the highest score possible is a 3.0, the lowest score possible is a 0. In cases where the use of modifiers results in global raw scores >3.0, the value is converted to a 3 prior to analysis; similarly, if modifiers result in a global raw score <0, the value is converted to a 0 prior to analysis.

    Videos are coded and global scores generated as long as 3 out of the 5 ERICA activities are completed. If less than 3 activities are completed, the video is not coded and scores are not generated.

    The following summary scores are produced:

    - `mh_cg_erica_3_9m_a_raw` — Child Positive Affect
    - `mh_cg_erica_3_9m_b_raw` — Child Irritability
    - `mh_cg_erica_3_9m_c_raw` — Child Social Engagement
    - `mh_cg_erica_3_9m_d_raw` — Caregiver Responsive Behavior
    - `mh_cg_erica_3_9m_e_raw` — Caregiver Irritable Behavior
    - `mh_cg_erica_3_9m_f_raw` — Caregiver Directive Behavior
    - `mh_cg_erica_3_9m_g_raw` — Dyadic Connectedness
  resources: null
  supp1_text: "## Centralized Coding of ERICA Videos  \n\nVideos are coded based on a single-pass review, with data entered directly into the HBCD database. Basic steps to ensure data completeness and accuracy include:\n\n \n\n- Double data entry with conflict resolution to ensure accurate data entry\n- Regular review of dashboards and reports to identify missing data and unexpected score distributions\n- Completion reports cross-referenced with video files \n\n \n\n##### ERICA Coding Training and Reliability Monitoring\n\nCoders were trained and certified by coding experts under the supervision of ERICA developers. Certification required ≥80% agreement with expert ratings (exact agreement within ±0.5 decimal points per code). To ensure ongoing coder reliability, 20% of each coder's videos were randomly selected for double coding by experts (reliability coders) on a weekly basis. Coders who fell below 80% agreement for two consecutive weeks on any code were pulled from coding and re-trained/certified\
    \ before continuing.\n\n \n\n##### Coding Reliability Statistics\n\n \n\nInter-rater reliability was quantified using a two-way mixed-effects intraclass correlation coefficient (ICC) (see table below). All codes were evaluated using ICC except for Caregiver Irritable Behavior. Due to its low base rate, this code was dichotomized and reliability was estimated using an unweighted kappa statistic. Updated reliability estimates may be provided in future data releases as additional data become available."
  measure: Early Regulation in Context Assessment [R3]
  construct: Emotional Regulation, Parenting, Caregiver-Child Relationship
mbcdi:
  status: Complete / Stable
  alert1: The CDI forms are well-documented and widely used assessments. We note that percentile scores were calculated based on the norms described in MacArthur-Bates User's Guide and Technical Manual, 3rd Edition (Marchman, Dale, and Fenson, 2023), see additional references below. See [HBCD Modifications](#hbcd-mod) for a description of how the CDI-WG is administered to children with exposure to different languages; users may want to consider the [Multilingual Language Development](../mlds) questionnaire in conjunction with the CDI.
  warning3_title: Benchmark Age
  hbcd_mods1: "Administration of the CDI-WG in English or Spanish is decided based on the results of the Multilingual Language Development questionnaire. \n\n- If the caregiver reports that the child has 30% or greater exposure to English and/or Spanish, they are prompted to complete the CDI in that language.\n- Children who are exposed to both English and Spanish at a greater than 30% level are prompted to complete both forms.\n- If caregivers report less than 30% exposure to either language, administration defaults to English."
  duration: 20-60 min
