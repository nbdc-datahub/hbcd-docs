  domain: Social & Environmental Determinants
  release: '2.1'
  qc: Monitor data dashboard for variable missingness, possible coding errors, scoring verification, and data consistency.
  administration: Remote
  scoring: |-
    **PROMIS Emotional Support 4a**

    Emotional support is reported on a 5-point Likert scale. Total raw scores (`total_raw_score`) are calculated as the sum of all item responses and are only computed when all items are answered. Raw scores are converted to scale/T-scores (`scale_score`) with standard errors (`standard_error`) using the [official scoring tables](https://www.healthmeasures.net/images/PROMIS/manuals/Scoring_Manuals_/PROMIS_Emotional_Support_Scoring_Manual.pdf) (see table "PROMIS Emotional Support 4a"). Higher scores indicate greater emotional support. To include participants with missing item responses, researchers may instead use the [HealthMeasures Scoring Service](https://www.assessmentcenter.net/ac_scoringservice) to generate T-scores.

    **Perceived Stress Scale–4 (PSS-4)**

    Perceived stress is reported on a 5-point Likert scale. Total scores (`total_score`) are calculated as the sum of all item responses and are only computed when all items are answered, i.e. have valid responses ranging from `0` to `4` (this excludes non-responses such as "Don't know"). Items 2 and 3 are reverse-coded prior to scoring (i.e., `0`→`4` becomes `4`→`0`). Higher summary scores indicate greater perceived stress.
  all_warnings_collapsed: null
