  description: "The HBCD ASSIST was adapted from the [NIDA Quick Screen (Modified ASSIST)](https://nida.nih.gov/sites/default/files/pdf/nmassist.pdf) and incorporates selected questions from the **Family History Assessment Module (FHAM)** and the **All of Us Personal and Family Health History **to assess substance use pre-, during, and post-pregnancy. For each substance, participants first indicate whether they have ever used it, and if so, frequency of use (_0 = Never, 1 = Once or Twice, 2 = Monthly, 3 = Weekly, and 4 = Daily or Almost Daily_). For substances reported before pregnancy, during pregnancy, or at the end of pregnancy, participants are also asked about modes of use and typical quantities consumed for alcohol and opioids if applicable.\n\n \n\nCompared with the original NIDA Quick Screen, the HBCD ASSIST expands both the range of substances assessed (see [ASSIST Substance Type Options](https://docs.hbcdstudy.org/latest/resources/pex/assist.html)) and the time periods evaluated.\
    \ Rather than asking only about use during the past year, the HBCD ASSIST collects information on lifetime use, problematic use, and use before pregnancy, during pregnancy, at the end of pregnancy, after pregnancy, and during the past three months. Detailed changes for each instrument are described under [HBCD Modification Details](#hbcd_mods). \n\n \n\nAdministration of the **Timeline Follow-Back (TLFB)** is triggered when substance use is reported before or during pregnancy (`pre-use` / `during_use`) on ASSIST V1, or at the end of pregnancy (`end_use`) on ASSIST V2. See the **[TLFB documentation](https://docs.hbcdstudy.org/2.1/instruments/pregexp/su/tlfb/)** for additional details."
