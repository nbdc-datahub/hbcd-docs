  alert3: |-
    Analysts using HBCD data have ethical obligations to minimize risks, including psychological, social, and economic risks, to research participants who generously provided their data. Risk minimization includes avoiding stigmatizing language when describing participants or the populations with which they identify, their phenotypes, or their genetic risks. It also includes carefully and clearly articulating limitations and caveats when reporting results and discussing how the results should and should not be interpreted or generalized.

    Results generated from HBCD data may be used to guide policy (e.g., for social services, education, or public health interventions). Researchers should be aware of policy implications and controversies related to their research. Some approaches for ethically conducting and reporting research using genetic data are discussed in [Meyer et al. (2023)](https://doi.org/10.1002/hast.1477), *Wrestling with Social and Behavioral Genomics: Risks, Potential Benefits, and Ethical Responsibility* (**The Hastings Center Report**).

    Researchers cannot control how others, including members of the public and policy makers, interpret scientific results we publish. However, we can take steps to minimize the likelihood our results will be misinterpreted or overinterpreted. In addition to clearly denoting limitations and caveats when reporting results, specific approaches for working with genomic data in this context are discussed in [Martshenko et al. (2025)](https://doi.org/10.1146/annurev-genom-011224-015733), *Social and Behavioral Genomics: On the Ethics of the Research and Its Downstream Applications* (**Annual Reviews Genomics and Human Genetics**). For examples of brief documents that explain social and behavioral genomics for non-experts, see “FAQs on Human Genomics Studies” at [https://www.thehastingscenter.org/genomics-research-index/](https://www.thehastingscenter.org/genomics-research-index/).
