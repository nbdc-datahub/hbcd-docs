    Data Exclusions
    A total of 22 samples were excluded from data release (i.e., are not contained in the public release files) due to poor genotyping quality (i.e., SNP Missingness >10%), unexpected unrelatedness with no confirmed use of reproductive technology, unexpected relatedness (i.e., identical samples across adults), and sex check mismatch.
  resources: null
  supp1_text: |-
    ## GDC Genomics QC Pipeline Analysis

    Along with [general QC](http://127.0.0.1:8000/instruments/biospec/illumina-gda-gwas/#illumina-global-diversity-gwas-array) described above, genomics data are processed through the [GDC Genomics QC](https://gdcgenomicsqc.readthedocs.io/en/latest/) pipeline ([GDCGenomicsQC](https://github.com/UMN-GDC/GDCGenomicsQC) on GitHub) to perform additional checks. Summary results are outlined below. Key features of this pipeline include:

    - Alternating filters for variant and subject missingness (10% followed by 2%)
    - Sex checks
    - Outlier detection based on the first two principal components derived from the genetic relatedness matrix using PC-AIR and PC-Relate ([GENESIS](https://bioc.r-universe.dev/GENESIS))
    - Classification of relatedness using IBD estimates from [KING](https://www.kingrelatedness.com/)

    ### Cryptic Relatedness

    KING coefficient–inferred relatedness identified previously unreported familial relationships. The anonymized cryptic relatedness family graphs (right) show inferred relationships based on the following KING coefficient intervals (all visualized edges represent unreported relationships):

    - [0.354, ∞] → Monozygotic twins or duplicate samples
    - [0.177, 0.354] → First-degree (parent–offspring or siblings)
    - [0.0884, 0.177] → Second-degree
    - [0, 0.0884] → Unrelated

    <img src="https://raw.githubusercontent.com/nbdc-datahub/hbcd-docs/main/docs/resources/biospec/family-clusters.png" alt="Family Clusters" width="500" height="auto" class="center">

    ### Genetic Ancestry-Based Clustering

    PC space derived from the first two PC-Relate components was visually inspected to assess clustering by reported race. Reported race largely clustered within the first two genetic principal components:

    <img src="https://raw.githubusercontent.com/nbdc-datahub/hbcd-docs/main/docs/resources/biospec/pca.png" alt="PCA" width="500" height="auto" class="center">

    Subject scores along the first 32 principal components, along with IBD estimates, genetic relatedness (estimated through PC-Relate), and kinship estimates are all included as derivatives. These derivatives were calculated off of the full sample less the individuals removed for QC related reasons. Individuals that were excluded for other non-genomic QC related reasons were included in these computations even if their data and related derivatives are not included for release.
  measure: Illumina Global Diversity GWAS Array (3.0)
  construct: GWAS, EWAS, Transcriptome
