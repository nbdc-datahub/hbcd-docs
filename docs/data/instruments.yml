  description: "**EEG Acquisition Flags for V03, V04, V06**\n\n \n\n- `Bgn+` — Start of task\n- `Stms` — MMN stimuli presentation\n- `DIN2` — StimTracker flag for auditory stimuli\n- `TRSP` — End of stimulus presentation; contains additional stimulus information (what sound was played)\n\n \n\nThe Auditory mismatch negativity (**MMN**) Task (v.11.29.23) facilitates examining auditory evoked potentials and habituation/dishabituation to auditory stimuli. The MMN captures differences in neural responses to standard (“ba”) and deviant (“da”) stimuli. From this task the MMN difference wave is computed, which is also known as the Mismatch Response (MMR). The amplitude/latency of this difference wave has been linked to language ([Choudhury & Benasich, 2011](https://doi.org/10.1016/j.clinph.2010.05.035)), temperament/personality ([Gurrera et al., 2001](https://doi.org/10.1016/S0006-3223(00)01067-2); [Marshall et al., 2009](https://doi.org/10.1111/j.1467-7687.2008.00808.x)), internalizing problems\
    \ ([Reeb-Sutherland et al., 2009](https://doi.org/10.1111/j.1469-7610.2009.02170.x)), externalizing/attention problems ([Gumenyuk et al., 2005](https://doi.org/10.1016/j.neulet.2004.10.081)), and disorders including autism ([Lepistö et al., 2005](https://doi.org/10.1016/j.brainres.2005.10.052); [Schwartz et al., 2018](https://doi.org/10.1016/j.neubiorev.2018.01.008)) and reading ability/dyslexia ([Leppänen et al., 2010](https://doi.org/10.1016/j.cortex.2010.06.003); [Norton, Beach, et al., 2021](https://doi.org/10.3389/fnhum.2021.624617)).\n\n### MMN Protocol Summary\n\nAuditory stimuli (“ba” = 196 ms; “da” = 198 ms) are presented while a video plays on an iPad (brightness at maximum, in airplane mode, and unplugged) to serve as a visual distractor. The task is paused for breaks as needed.\n\n**Visit 3 trial progression schematic:**\n \n\n- **Trial Count**\n    - Standard condition: 569\n    - Deviant condition: 98\n    - Total: 667\n- **Timing Details**\n    - Stimulus duration: 200\
    \ ms\n    - Interstimulus interval: 820 ms (V03); 600 ms (V04/V06)\n    - Total trial length: 1020 ms (V03); 800 ms (V04/V06)"
