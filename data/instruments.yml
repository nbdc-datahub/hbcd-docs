  scoring: The Dynamic Table does not use conventional scoring procedures. It combines source variables with derived or harmonized variables, organized by child and scheduled study visit/session.  Variables retain the value associated with the relevant visit or are constructed from source data associated with that visit.   For primary caregiver education and household income, source responses are collapsed into standardized categories for use in the Dynamic Table. The longitudinal variables are intended to represent the caregiver or household information applicable at the corresponding study visit.  Household size is a constructed measure. At V01, household size is calculated from the Adult Demographics form by summing the reported number of adults aged 18 years and older and children aged 17 years and younger, and then adding one because the questions exclude the respondent. At V04 and later applicable visits, household size is calculated from the Child Demographics form by summing the
    reported number of adults and children and then adding one because the questions exclude the focal HBCD child.  Visit-specific contextual variables, including urban/rural classification and Social Vulnerability Index measures, are linked to the residential information associated with the corresponding visit.
