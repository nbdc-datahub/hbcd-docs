  description: The **ecPROMIS** (Early Childhood Patient-Reported Outcome Measurement Information System) is a set of primary caregiver report questionnaires that offer clinicians and researchers a brief, efficient, and precise way to evaluate young children’s well-being. The **Self-Regulation - Flexibility Scale** assesses young children’s ability to adapt in response to environmental demands, changes, and expectations.
