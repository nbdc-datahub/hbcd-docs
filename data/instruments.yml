  acronym: Nails
  warning3: A substantial number of samples show unusually long intervals between collection and analysis (e.g., over 100–300 days, compared to the 30-day limit specified by internal SOPs). We are working to determine whether this reflects a data entry or site-level issue and will provide an update once more information is available.
  Form Link: https://form.fillout.com/t/qaNxHYsnPBus?id=recQ513WlWpLFHjHB
  warning1: 'As of November 2025, USDTL no longer assayed sufentanil in the nail samples.

    As of July 1, 2024, the nail processing workflow was updated to optimize specimen use and allow confirmation testing for low sample quantities. Prior to this update, remnants of ELISA extract were not used for confirmation when specimens had insufficient sample.'
  description: '<img src="https://github.com/nbdc-datahub/hbcd-docs/raw/main/docs/resources/biospec/Fig1_nails.png" alt="Nail processing workflow" width="600" height="auto" class="center">


    For the USDTL assay, fingernail and toenail specimens are sorted by weight, and those weighing at least 20 mg undergo ELISA screening, followed by LCMSMS confirmation for presumptive positives, each requiring an additional 20 mg. If insufficient specimen remains for LCMSMS, the remnant ELISA extract is used for confirmation.


    Based on the predefined thresholds (see _Nail Assay Thresholds_ below), a confirmatory test result for any substance analyte is determined to be positive, negative, or invalid (_QNS_ i.e. _quantity not sufficient_). Substance analytes (e.g. **Amphetamine/`c_amp_n`**) are grouped into different classes by analyte screening tests and confirmatory tests (see [Mapping from Class to Screening & Confirmatory Tests](nails_table2.html)).'
  slug: usdtl-nails-toxicology-maternal-
  domain: Biospecimen & Omics
  release: '2.1'
  qc: Examine assay ranges and categorical versus continuous measures
  administration: In-person
  scoring: '**Final results for each substance follow these rules:**


    - **Positive results:** If any confirmatory test for a substance analyte (e.g., Amphetamine/`c_amp_n`) is positive based on predefined thresholds, then the corresponding class-level (`c_any_stim_n`) and overall sample-level (`c_any_specimen_n`) results are also positive.

    - **Negative results:** If all confirmatory tests for analytes in a class are negative, then the class-level result is negative. If all classes are negative, the overall sample-level (`c_any_specimen_n`) result is negative.

    - **Invalid results:** If any confirmatory test for a substance analyte is invalid, then the corresponding class-level and overall sample-level results are also invalid.


    <!-- HARD-CODED TABLE -->'
  warning4_title: Interpretation of “QNS” in Confirmatory Results When a Positive Is Expected
  measure: USDTL Nails Toxicology (Maternal)
  construct: Drug Panel, Environmental Exposure
via:
  status: README updated & ready for SME review
  alert1: When using HBCD data, all data users must agree to responsible use as described in the data use certification (DUC). When conceptualizing studies, analyzing data, and communicating analyses hat address socially sensitive topics, it is critical that data users consider strategies to avoid stigmatization of any groups and avoid perpetuating harmful biases.
  duration: 5 min
  full_name: Vancouver Index of Acculturation
  alert3: Some variables in this release have small cell sizes. As a condition of using these data, specified in the DUC, you agree not to identify any individual from whom data was obtained and not to identify their relatives. You agree to a minimum cell threshold of 10 in any public reporting of the data (publications, posters, or other presentations). Protecting participants’ anonymity demonstrates respect for them and minimizes their research-related risks.
  alert2: Immigration status was not collected as part of this measure, and data users should not infer or assume immigration status in their analyses or interpretations.
  assessment_type: Questionnaire
  table_name: sed_cg_via
  references: 'Ryder, A. G., Alden, L. E., & Paulhus, D. L. (2000). Is acculturation unidimensional or bidimensional? A head-to-head comparison in the prediction of personality, self-identity, and adjustment. _Journal of Personality and Social Psychology_, 79(1), 49–65. [doi: 10.1037//0022-3514.79.1.49.](https://doi.org/10.1037//0022-3514.79.1.49) PMID: 10909877.

    Testa, S., Doucerain, M. M., Miglietta, A., Jurcik, T., Ryder, A. G., & Gattino, S. (2019). The Vancouver Index of Acculturation (VIA): New evidence on dimensionality and measurement invariance across two cultural settings. _JInternational Journal of Intercultural Relations_, 71, 60–71. <https://doi.org/10.1016/j.ijintrel.2019.04.001>'
  respondent_category: Parent on Self
  admin_notes: None
  README URL: https://docs.hbcdstudy.org/latest/instruments/SED/vi/
  visits: V05
  primary_data_type: Tabulated data
  acronym: VIA
  Form Link: https://form.fillout.com/t/qaNxHYsnPBus?id=recQGFsaNGnYEZNsM
  description: '**Acculturation** is a cultural change that occurs when individuals from one cultural background come into continuous, first-hand contact with another cultural setting. This happens when immigrants emigrate from their heritage culture to a receiving culture, in this case the United States or “American” culture. Acculturation may also happen when second-generation US-born individuals with foreign-born parents experience a family/heritage culture in their home and upbringing that is different from the environmental culture they were born into, in this case “American” culture. This first-hand contact may result in individual changes (i.e., values, attitudes, beliefs, and identities) and group changes (i.e., social and cultural systems).


    The **Vancouver Index of Acculturation (VIA)** measures acculturation orientations, or the way immigrants prefer to relate to the society of settlement (cultural adoption) and country of origin (cultural maintenance). For this study, we use the terms “family culture” for a participant’s heritage/ethnic cultural practices and “American culture” for cultural practices that are part of mainstream American culture. In VIA, concepts are not unidimensional where an individual can either maintain the culture of origin OR adopt the culture of settlement. Participants are allowed to choose more than one culture to account for multicultural households. The VIA seeks to understand the participant’s personal preferences for taking part in their family culture as well as those of American culture, if they are different.


    Some immigrants may consider American culture as their family culture. They can select “none” to indicate they do not identify with a culture other than American. We attempted to capture many different countries, ethnicities, and religions for participants to select. However, if a participant’s family culture is not listed, they can select “None of these apply/My family culture is not listed.”


    Participants are not to be asked about immigration or documentation status. The intent is that they only answer this survey if they feel comfortable revealing their generational status (first, second, or third generation immigrant) based on the gating questions provided.'
  slug: vancouver-index-of-acculturation
  domain: Social & Environmental Determinants
  release: '2.1'
  qc: The VIA is administered only if the caregiver, spouse/partner, or any of the child's grandparents were born outside the U.S. If all are U.S.-born, the survey platform (REDCap) automatically ends the questionnaire after the screening questions.
  administration: In-person/Remote
  scoring: 'The family culture subscore is the mean of the 9 items asking about "family culture," whereas the mainstream subscore is the mean of the 9 items asking about "American culture."


    - Family culture questions are even-numbered: `sed_cg_via_006` through `sed_cg_via_022`.

    - American culture questions are odd-numbered: `sed_cg_via_007` through `sed_cg_via_023`.


    Response options 777 ("Decline to answer"), or 999 ("Don''t know") are not included in the mean score calculations.

    High scores on each 9-item subscale can be interpreted as a positive orientation toward the specific cultural group and/or higher levels of identification with the culture represented. A high score on both subscales is associated with having a strong bicultural identity. Subscale mean scores can be used independently and/or compared by researchers in a variety of ways, depending on the research question.'
  measure: Vancouver Index of Acculturation
  construct: Acculturation
