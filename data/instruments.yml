  Form Link: https://form.fillout.com/t/qaNxHYsnPBus?id=recojL45MiljQmOZB
  warning1: The dataset includes two birth parents who are monozygotic twins (along with their respective families), which may complicate certain analyses. The participant IDs associated with this twin pair are under internal review and may be shared in a future update.
  description: "## Instrument Details\n\nGenomic data generated from the **Illumina Global Diversity Array (GDA GWAS)** is provided for both the birth parent and child. Samples are assayed from one sample, but may come from any visit (V01-V06) based on DNA yields. The dataset includes batch metadata and interlinked PLINK files (`.bed`, `.bim`, `.fam`) aligned to the **GRCh38/hg38 Build**. \n\n## Release Data\n\nThe GDA GWAS dataset is provided as [concatenated data](http://127.0.0.1:8000/datacuration/file-based-data/#concatenated-data) including the following files:\n\n- `batch.info`: Plain-text file mapping participants to genotyping batches\n- `hbcd.bed` ([PLINK 1.9 .bed](https://www.cog-genomics.org/plink/1.9/formats#bed), distinct from UCSC BED): Binary genotype file\n- `hbcd.bim` ([PLINK 1.9 .bim](https://www.cog-genomics.org/plink/1.9/formats#bim)): Variant information (chromosome, rsID, position, alleles)\n- `hbcd.fam` ([PLINK 1.9 .fam](https://www.cog-genomics.org/plink/1.9/formats#fam)):\
    \ Participant information\n- `pcrelate_relatedness.grm.bin`: PC-Relate adjusted genetic relatedness matrix\n- `pcrelate_relatedness.grm.N.bin`: PC-Relate pairwise common SNP count\n- `pcrelate_relatedness.grm.id`: PC-Relate subject IDs, corresponding to the matrix column and row order\n- `pcrelate_relatedness.tsv`\n- `family_clusters.txt`"
  slug: illumina-global-diversity-gwas-array-3-0-
  domain: Biospecimen & Omics
  release: '3.0'
  alert3_title: Ethical Obligations to Minimize Risks
  qc: |-
    - Check that sampled ID and sample-specific barcodes match from Sampled File and Lasso Database.
    - Check that genomic sex matches with sex at birth.
    - Check that genetic relatedness of each sample matches Lasso data (i.e., that IBD is ~0.25 between the birth parent and child as well as siblings; evaluate potential twins).
    - Use FHET estimates to check for plate contamination.
    - Visually inspect plate effects on principal component space derived from PC-Relate.
    - GDC Genomics QC pipeline analysis - see details and summary statistics [below](#gdc-genomics-qc-pipeline-analysis).
  administration: In-person
  scoring: null
  resources: null
  supp1_text: |-
    ## GDC Genomics QC Pipeline Analysis

    Along with [general QC](http://127.0.0.1:8000/instruments/biospec/illumina-gda-gwas/#illumina-global-diversity-gwas-array) described above, genomics data are processed through the [GDC Genomics QC](https://gdcgenomicsqc.readthedocs.io/en/latest/) pipeline ([GDCGenomicsQC](https://github.com/UMN-GDC/GDCGenomicsQC) on GitHub) to perform additional checks. Summary results are outlined below. Key features of this pipeline include:

    - Alternating filters for variant and subject missingness (10% followed by 2%)
    - Sex checks
    - Outlier detection based on the first two principal components derived from the genetic relatedness matrix using PC-AIR and PC-Relate ([GENESIS](https://bioc.r-universe.dev/GENESIS))
    - Classification of relatedness using IBD estimates from [KING](https://www.kingrelatedness.com/)

    ### Cryptic Relatedness

    KING coefficient–inferred relatedness identified previously unreported familial relationships. The anonymized cryptic relatedness family graphs (right) show inferred relationships based on the following KING coefficient intervals (all visualized edges represent unreported relationships):

    - [0.354, ∞] → Monozygotic twins or duplicate samples
    - [0.177, 0.354] → First-degree (parent–offspring or siblings)
    - [0.0884, 0.177] → Second-degree
    - [0, 0.0884] → Unrelated

    <img src="https://raw.githubusercontent.com/nbdc-datahub/hbcd-docs/main/docs/resources/biospec/family-clusters.png" alt="Family Clusters" width="500" height="auto" class="center">

    ### Genetic Ancestry-Based Clustering

    PC space derived from the first two PC-Relate components was visually inspected to assess clustering by reported race. Reported race largely clustered within the first two genetic principal components:

    <img src="https://raw.githubusercontent.com/nbdc-datahub/hbcd-docs/main/docs/resources/biospec/pca.png" alt="PCA" width="500" height="auto" class="center">

    Subject scores along the first 32 principal components, along with IBD estimates, genetic relatedness (estimated through PC-Relate), and kinship estimates are all included as derivatives. These derivatives were calculated off of the full sample less the individuals removed for QC related reasons. Individuals that were excluded for other non-genomic QC related reasons were included in these computations even if their data and related derivatives are not included for release.
  measure: Illumina Global Diversity GWAS Array (3.0)
  construct: GWAS, EWAS, Transcriptome
