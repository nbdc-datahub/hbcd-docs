  warning1: 74 samples that were run in this batch are not included in this data release. However, data normalized by median plate intensity included NPX values from these excluded subjects. We anticipate that these subjects will be included in later data releases.
  description: 'Protein abundance of inflammatory markers was measured using the **Olink Explore 384 Inflammation 1 Panel ([Olink® Explore 3072/384](https://olink.com/products/olink-explore-3072-384))**, with data generated using Explore version 6.7.2.


    Olink data are reported as Normalized Protein eXpression (**NPX**) values. NPX is a proprietary, arbitrary unit that reflects relative protein abundance, with higher values indicating higher abundance. Values are reported on a log₂ scale, such that a difference of 1 NPX corresponds to a two-fold difference in protein abundance. Note that NPX values are only comparable for the same protein across samples and plates and cannot be used for comparisons between different proteins. See the [Panel Quick Guide](#olink-panel-quick-guide) at the end of this page for the full assay list.'
  slug: olink-explore-384-inflammation-1-panel
  domain: Biospecimen & Omics
  release: '2.1'
  qc: Olink internal assay controls include extension (used for normalization to generate NPX values), incubation, and amplification controls used to monitor assay performance and individual sample quality. See the [Olink® Explore Overview](https://7074596.fs1.hubspotusercontent-na1.net/hubfs/7074596/01-User%20Manuals%20for%20website/1187-olink-explore-overview-user-manual.pdf) (section 7.1 Internal controls) for details. Proteins that did not meet Olink’s quality control criteria (N=10) have values of `0` for `{ASSAY}_Count` and _NA_ for `ExtNPX`, `NPX`, and `PCNormalizedNPX`.
