  description: |-
    The **VS100 Spot Vision Screener** is used to screen for six vision and oculomotor domains - see [manufacturer documentation](https://www.hillrom.com/en/products/spot-vision-screener/). The VS100 is only administered if the parent responds **NO** to the eligibility question (“Have you been told that your child cannot see at all?”, i.e., cannot see shadows or distinguish light and dark). Screening is conducted according to manufacturer instructions and HBCD study standard operating procedures. The device produces an _overall screening result_ based on _age-specific threshold values_, as defined by established guidelines from the American Academy of Pediatric Ophthalmology and Strabismus ([AAPOS](https://www.aapos.org/home)):

    - **PASS**: All measured domains fall within age-appropriate thresholds
    - **REFER / COMPLETE EYE EXAM RECOMMENDED**: One or more domains falls outside acceptable age-appropriate thresholds

    The current release includes completion status and overall screening results. Release data will eventually include all information recorded by the Vision Screener for each of the six domains, including both the overall screening result (PASS/REFER) **and** all measurements used to assess vision performance and determine the screening result.
