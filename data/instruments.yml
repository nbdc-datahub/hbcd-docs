  supp2_text: '## Processing & Derivatives


    qMRI data are processed via [SyMRI](https://syntheticmr.com/products/symri-neuro/) followed by minimal post-processing through [qMRI PostProc](https://hbcd-symri-postproc.readthedocs.io/en/latest/index.html). SyMRI derives synthetic T1w/T2w images and quantitative relaxometry maps from 3D-QALAS acquisitions by reintroducing estimated T1/T2 relaxation times into the MR signal equation (Bloch equations).'
