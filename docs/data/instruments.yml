    Head motion is a serious issue in neuroimaging, especially for resting state fMRI, as it creates brain-wide artifactual effects such as inflated short-distance connectivity and attenuated long-distance connectivity ([Power et al. 2012](https://doi.org/10.1016/j.neuroimage.2011.10.018)). Researchers employ a variety of strategies to mitigate head motion during acquisition and processing ([Power et al. 2014](https://doi.org/10.1016/j.neuroimage.2013.08.048); [2015](https://doi.org/10.1016/j.neuroimage.2014.10.044); [Satterthwaite et al. 2013](https://doi.org/10.1016/j.neuroimage.2012.08.052); [Siegel et al. 2017](https://doi.org/10.1093/cercor/bhw253); [Gratton et al. 2020](https://doi.org/10.1016/j.neuroimage.2020.116866)). This includes motion censoring (discarding individual frames that are proximal to motion events within a run) and/or excluding entire runs due to high motion. These strategies may lead to the exclusion of some participants from further analysis due to lack of sufficient data.

    Levels of head motion differ according to demographic factors such as sex, race/ethnicity, and SES ([Cosgrove et al., 2022](https://doi.org/10.1007/s11682-022-00665-2)). Therefore, mitigation strategies for head motion introduce questions around fairness and differential exclusions across demographic groups. In addition, motion censoring causes sessions to vary by the amount of data remaining. Such variability may continue to inflate findings especially in the presence of conditions that may correlate with the motion artifact like autism or ADHD ([Eggebrecht, 2017](https://doi.org/10.1093/cercor/bhw403)). The amount of data remaining influences the variation in the connectivity calculations by affecting the degrees of freedom. Therefore, even after motion censoring, issues concerning fairness may persist when examining factors that might be affected by motion like sex, race/ethnicity, SES, and BMI ([Cosgrove et al., 2022](https://doi.org/10.1007/s11682-022-00665-2)). One strategy that avoids this confound is to strictly control the degrees of freedom, where functional connectivity measures are calculated with the exact same amount of data. Researchers should assess whether control of artifactual effects of head motion effects can be achieved by alternative means that mitigate this impact. Examples of such strategies could include data augmentation approaches such as sampling from other datasets, data processing strategies like the include use of ICA-based denoising ([Pruim et al., 2015a](https://doi.org/10.1016/j.neuroimage.2015.02.064); [2015b](https://doi.org/10.1016/j.neuroimage.2015.02.063)), use of bootstrap aggregation ([Ramduny et al., 2024](https://doi.org/10.1101/2024.06.22.600221)), or the creation of “pseudo-rest” by removing task signals from the task data ([Fair et al. 2007](https://doi.org/10.1016/j.neuroimage.2006.11.051)), or post-hoc approaches like propensity weighting.
