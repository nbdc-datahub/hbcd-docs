dmri:
  status: README updated & ready for SME review
  full_name: Diffusion MRI
  assessment_type: Direct Assessment
  table_name: img_qsiprep_space-ACPC_desc-image_qc
  references: 'Alexander AL, Lee JE, Lazar M, Field AS. (2007). Diffusion tensor imaging of the brain. _Neurotherapeutics_, 4(3):316-29. [10.1016/j.nurt.2007.05.011](https://doi.org/10.1016/j.nurt.2007.05.011)

    Basser PJ, Mattiello J, LeBihan D. (1994). MR diffusion tensor spectroscopy and imaging. _Biophys J._, 66(1):259-67. [10.1016/S0006-3495(94)80775-1](https://doi.org/10.1016/S0006-3495(94)80775-1)

    Cieslak M, Cook PA, He X, Yeh FC, Dhollander T, Adebimpe A, Aguirre GK, Bassett DS, Betzel RF, Bourque J, Cabral LM, Davatzikos C, Detre JA, Earl E, Elliott MA, Fadnavis S, Fair DA, Foran W, Fotiadis P, Garyfallidis E, Giesbrecht B, Gur RC, Gur RE, Kelz MB, Keshavan A, Larsen BS, Luna B, Mackey AP, Milham MP, Oathes DJ, Perrone A, Pines AR, Roalf DR, Richie-Halford A, Rokem A, Sydnor VJ, Tapera TM, Tooley UA, Vettel JM, Yeatman JD, Grafton ST, Satterthwaite TD. (2021). QSIPrep: an integrative platform for preprocessing and reconstructing diffusion MRI data. _Nature Methods_, 18(7):775-778. [10.1038/s41592-021-01185-5](https://doi.org/10.1038/s41592-021-01185-5)

    Cieslak, M., Irfanoglu, M. O., Meisler, S. L., Salo, T., Raikes, A. C., Cook, P. A., Chung, A. W., Lee, E. G., Li, R., Li, X., Pecheva, D., Fair, D. A., Smyser, C. D., Harms, M. P., Landman, B. A., Wisnowski, J. L., Huang, H., Alexander, A. L., & Satterthwaite, T. D. (2025). Diffusion MRI processing in the HEALthy Brain and child development study: Innovations and applications. _In bioRxiv._ <https://doi.org/10.1101/2025.11.10.687672>

    Jensen, J. H., Helpern, J. A., Ramani, A., Lu, H., & Kaczynski, K. (2005). Diffusional kurtosis imaging: the quantification of non-gaussian water diffusion by means of magnetic resonance imaging. Magnetic Resonance in Medicine, 53(6), 1432–1440. <https://doi.org/10.1002/mrm.20508>

    Özarslan E, Koay CG, Shepherd TM, Komlosh ME, İrfanoğlu MO, Pierpaoli C, Basser PJ. (2013). Mean apparent propagator (MAP) MRI: a novel diffusion imaging method for mapping tissue microstructure. _Neuroimage_, 78:16-32. [10.1016/j.neuroimage.2013.04.016](https://doi.org/10.1016/j.neuroimage.2013.04.016)'
  respondent_category: Child on Self
  admin_notes: Note that not all parts of the page are editable via this form - reach out to Luci for assistance
  README URL: https://docs.hbcdstudy.org/latest/instruments/mri/dmri/
  primary_data_type: File-based (raw BIDS/derivatives)
  acronym: dMRI
  Form Link: https://form.fillout.com/t/qaNxHYsnPBus?id=rec0BINzmTsH2DHdm
  warning1: "`LargeDelta` and `SmallDelta` in the raw BIDS sidecar JSON files currently are set to vendor-specific values, which aren't always correct because the models have their own values. These changes don’t affect the preprocessing of the data and only affect the QSIRecon outputs of the MAP-MRI model by an offset. This is also listed as a known issue and will be updated to reflect accurate values as follows:\n\n- Phillips\n    - `SmallDelta` = 14.4\n    - `LargeDelta` = 44.4\n- GE\n    - `SmallDelta` = 21.8\n    - `LargeDelta` = 43.1\n- Siemens\n    - `SmallDelta` = 14.2\n    - `LargeDelta` = 43.0"
  description: '**Diffusion-Weighted Imaging (DWI)** measures the diffusion of water molecules in tissue and is used to model white matter microstructure and structural connectivity in the central nervous system. Full protocols, sequence installation, and operation instructions are available via [HBCD Study MRI Protocols](https://hbcdsequences.readthedocs.io/). In brief, the DWI protocol acquires roughly 140 diffusion-weighted echo planar images at four b-values (diffusion-weighting) between 0 and 3000 s/mm2 (12-13 minutes total acquisition time). For raw image acquisition, a minimum of 60% of the diffusion-weighted volumes are required to be collected for the acquisition to be deemed successful.'
  slug: diffusion-mri
  domain: Imaging/Tabular Imaging
  release: '2.1'
  qc: 'Automated QC for processed diffusion data is fairly robust, with metrics provided in `sub-[ID]_ses-[V0X]_space-ACPC_desc-image_qc.tsv` within the QSIPrep derivatives (see [QSIPrep documentation](https://qsiprep.readthedocs.io/en/latest/preprocessing.html#quality-control-data) for details). Below are distributions of automated QC metrics from HBCD visits V02 and V03. Higher Neighboring DWI Correlation (NDC; closer to 1) and Contrast-to-Noise Ratio (CNR) indicate better image quality. NDC can also be used as a covariate in analyses to account for QC variation.


    **Left**: NDC calculated pre- and post-processing for each vendor using combined AP/PA scans

    **Right**: Shell-wise CNR calculated by Eddy. We do not provide exclusion threshold recommendations because all data passed preliminary QC. However, NDC and CNR are useful covariates when analyzing other derivatives.


    <!-- HARDCODED IMAGE -->'
  administration: In-person
  supp1_text: 'Diffusion MRI data are preprocessed using **[QSIPrep](https://qsiprep.readthedocs.io/)**, which performs motion and distortion correction, MP-PCA denoising, co-registration to T1w images, spatial normalization (ANTs), and tissue segmentation ([Cieslak et al. 2021](https://doi.org/10.1038/s41592-021-01185-5), [Cieslak et al. 2025](https://doi.org/10.1101/2025.11.10.687672)). Preprocessed QSIPrep outputs are passed to **[QSIRecon](https://qsirecon.readthedocs.io/)**, which runs curated reconstruction workflows, including ODF/FOD reconstruction, tractography, Fixel estimation, and regional connectivity. The diffusion encoding provided via the multiple QSIRecon derivative folders enable the estimation of multiple diffusion MRI models to create the derived data, outlined below. Full details of HBCD diffusion MRI processing and methods are described in [Cieslak et al. 2025](https://doi.org/10.1101/2025.11.10.687672).


    <!-- HARDCODED TABLE -->'
  measure: Diffusion MRI
