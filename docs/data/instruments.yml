  warning1: |-
    V02 data (0-1 month old) were processed in Infant fMRIPrep via two separate surface reconstruction workflows, M-CRIB-S (`hash-0f306a2f`) and Infant FreeSurfer (`hash-2afa9081`). Expert review and BrainSwipes QC consistently showed higher-quality surfaces from M-CRIB-S. This is expected, as M-CRIB-S uses T2w images, which are much higher contrast than the T1w (on which FreeSurfer relies) in neonates. [Goncalves et al., 2025](https://doi.org/10.1101/2025.05.14.654069) report optimal performance for M-CRIB-S ≤5 months and Infant FreeSurfer ≥3 months. We therefore recommend only using data processed via the M-CRIB-S worfklow for analyses (`nibabies-0f306a2f`/`xcp_d-0f306a2f+0ef9c88a`).
    _Note:_ M-CRIB-S outputs can still be affected by poor T1w quality as it uses an externally generated brain segmentation from BIBSNet fed into Infant fMRIPrep as an external derivative. BIBSNet uses both T1w and T2w (when available), and low-quality T1w data may degrade segmentation quality.
  description: |-
    Functional MRI (fMRI) measures brain activity via the blood oxygen level–dependent (BOLD) signal. The HBCD Study includes resting-state fMRI (rs-fMRI), with head motion monitored in real time using [FIRMM](https://firmm.readthedocs.io/) to estimate usable data during acquisition as quantified by framewise displacement (FD) ([Dosenbach et al., 2017](https://doi.org/10.1016/j.neuroimage.2017.08.025)).

    A minimum of 2 runs are collected (during sleep for infants <30 months old), each lasting 7.5 minutes. A target of 7.5 minutes of usable low-motion data ((FD<0.3 mm)) is acquired across runs per session, with additional runs acquired as needed/possible to reach the target. Each run includes forward and reverse phase-encoding spin-echo EPI images for distortion correction. Data are acquired at 2 mm isotropic resolution with a repetition time (TR) of 1725 ms and multiband (MB) factor of 4.
