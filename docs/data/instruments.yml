  domain: Biospecimen & Omics
  release: '2.1'
  qc: Examine assay ranges and categorical versus continuous measures
  administration: In-person
  scoring: |-
    **Final results for each substance follow these rules:**

    - **Positive results:** If any confirmatory test for a substance analyte (e.g., Amphetamine/`c_amp_n`) is positive based on [predefined thresholds](http://127.0.0.1:8000/instruments/biospec/nails/#nails-table1), then the corresponding class-level (`c_any_stim_n`) and overall sample-level (`c_any_specimen_n`) results are also positive.
    - **Negative results:** If all confirmatory tests for analytes in a class are negative, then the class-level result is negative. If all classes are negative, the overall sample-level (`c_any_specimen_n`) result is negative.
    - **Invalid results:** If any confirmatory test for a substance analyte is invalid, then the corresponding class-level and overall sample-level results are also invalid.

