  description: 'The Infant Behavior Questionnaire–Revised Very Short Form + Behavior Inhibition **(IBQ-R VSF+BI)** and Early Childhood Behavior Questionnaire Very Short Form + Behavior Inhibition **(ECBQ VSF+BI)** are caregiver-report measures of temperamental reactivity and self-regulation in early development. Both instruments extend the validated Very Short Forms (VSF) of the IBQ-R and ECBQ by incorporating additional items from the long-form questionnaires (items 38–47) to capture Behavioral Inhibition (Social Fear).  The HBCD versions therefore include four scale domains: **Behavioral Inhibition**, **Negative Affectivity**, **Effortful Control**, and **Surgency/Extraversion**. Scale domain items for the IBQ and ECBQ are listed in the table below, with reverse scoring (“R”) and duplicate items for BEH and NEG scale noted:'
  slug: ibq-r-ecbq
  domain: Behavior & Caregiver-Child Interactions
  release: '2.1'
  qc: |-
    - Examine missingness by counting items answered per participant.
    - Check age is within expected ranges.
    - Review summary statistics and visualizations (item frequencies, age, prorated scores).
    - Assess reliability (Cronbach’s α).
  administration: Remote
  scoring: "The IBQ-R and ECBQ item responses are reported on a 7-point Likert scale (from 1 = Never to 7 = Always). For each domain (Behavioral Inhibition, Negative Affectivity, Effortful Control, and Surgency/Extraversion), summary scores are computed as the mean of all items with values of 1-7. This excludes non-response options, \"Does not apply\" and \"Decline to answer,\" which are not scored and considered missing.  \n\n \n\nPrior to computing summary scores, reverse scoring (i.e. values reassigned from 1→7 to 7→1) is applied to items labeled with **(R)** in the [Domain Items](https://docs.hbcdstudy.org/latest/instruments/bcgi/ibqr/#ibq-r-ecbq-domain-items) table above. In the release data, the raw item-level data is not reverse-scored already. However, the domain scores do incorporate the reverse scoring. \n\n \n\nSummary scores are not computed if more than 40% of the items are missing responses (e.g. there are only 7/12 items with numerical responses of 1-7) and are instead marked\
    \ as missing.\n\n \n\nFor additional information, see the HBCD data dictionary for details on items and scales and [Mary Rothbart's Temperament Questionnaires](https://research.bowdoin.edu/rothbart-temperament-questionnaires) for background on measure development."
  all_warnings_collapsed: |-
    Interpreting Data
    The IBQ-R (VSF)+BI and ECBQ (VSF)+BI measure normative variations in infant and child behavior and should be interpreted in the context of the child’s age and developmental stage. These instruments are not clinical or diagnostic tools.

    IBQ-R vs ECBQ Administration at V05
    At V05 (10–17 months), participants could be administered either the IBQ-R (validated for ages 3–12 months) or the ECBQ (validated for ages 18–36 months), depending on their age at the visit. Because no validated measure exists for 12–18 months, researchers are advised to select the instrument that best aligns with their study design. The HBCD protocol spans this age gap, so the decision was made to administer the IBQ-R to all infants at V03 and V05.

    However, early in data collection, the ECBQ was inadvertently administered to infants older than 12 months (N=78). In a small number of cases (N=10), caregivers had not completed all of their V05 remote surveys before the child aged into the ECBQ range, resulting in both measures being administered at V05. Although IBQ-R and ECBQ assess similar constructs, they are not interchangeable. Users should review measure-specific properties before incorporating these data into analyses.
