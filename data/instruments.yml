assist:
  status: README updated & ready for SME review
  alert1: 'Responsible use of prenatal drug exposure data requires thoughtful interpretation of exposure-related outcomes in the context of measured and unmeasured confounders. These confounders include, but are not limited to, phenotypic risks associated with persistent alcohol, tobacco, and other drug use during pregnancy by birthing parents ([Massey et al., 2010](https://doi.org/10.1111/j.1521-0391.2010.00110.x)), and confounding by familial risk from within-family studies ([Estabrook et al., 2016](https://doi.org/10.1007/s10519-015-9762-2)).


    Finally, unwarranted speculation about ‘neural bases of behavior’ form differences in neuroimaging between exposed and unexposed children in the absence of differences in behavioral performance can exacerbate stigma already faced by birthing parents with substance use disorders and their children ([McAllister & Hart 2015](https://doi.org/10.1016/j.ntt.2015.07.002)).'
  hbcd_mods2_title: Replacement Questions for NIDA Quick Screen
  hbcd_mods1: Unlike the original NIDA Modified ASSIST, the HBCD adaptation is **not scored**. When describing these measures in publications, authors may note that the instrument was adapted from the NIDA Modified ASSIST.
  alert1_title: V1 & V2
  duration: 3-5 min
  hbcd_mods2: '##### ASSIST V1


    **Lifetime (`lt__use`) substance use and disordered use, 3 months pre-pregnancy (`pre_use`), and during pregnancy (`during_use`)**


    - `[lt__use] `IN YOUR LIFE, which of the following substances have you EVER used for any reason?

    - `[lt__concern]` Have you EVER been concerned about your use of this substance or worried it was problematic use?

    - `[lt__concernoth]` Has a friend, relative, or anyone else EVER expressed concern about your use of this substance?

    - `[control]` Have you EVER tried and failed to control, cut down, or stop using this substance?

    - `[tx]` Have you EVER sought or received treatment related to your use of this substance by a medical provider, spiritual leader, community mutual help group (like AA or SMART Recovery), counselors, or in other settings?

    - `[diagn]` Have you EVER been clinically diagnosed with abuse, dependence, or a substance use disorder related to your use of this substance?

    - `[med]` Have you EVER taken (prescribed or otherwise) medication(s) as treatment for a problem substance?

    - `[pre_use]` IN THE THREE MONTHS BEFORE YOU BECAME PREGNANT, which of the following substances have you ever used for any reason?

    - `[during_use]` DURING YOUR PREGNANCY, which of the following substances have you ever used for any reason?

    - `[during_med]` DURING YOUR PREGNANCY, did you take (prescribed or otherwise) medication(s) as treatment for a problem substance?


    ##### ASSIST V2


    **Use after pregnancy**


    - `[end_use]` SINCE WE LAST MET UNTIL THE END OF PREGNANCY, which of the following substances did you use for any reason?

    - `[end_med] `SINCE WE LAST MET UNTIL THE END OF PREGNANCY, did you take (prescribed or otherwise) medication(s) as treatment for a problem substance?

    - `[post_use] `FROM THE TIME THAT YOU DELIVERED your child until now, how often have you used any of the following substances for any reason?


    ##### ASSIST V3


    **Substance use in past 3 months and impact after pregnancy**


    - `[3m_use]` IN THE PAST THREE MONTHS, how often have you used any of the following substances for any reason?

    - `[problem]` DURING THE PAST THREE MONTHS, has your use of this substance led to physical or mental health, social, or financial problems?

    - `[perform]` DURING THE PAST THREE MONTHS, have you ever failed to do what was normally expected of you (like work, go to school, be a parent, or household tasks) because of your use of this substance?


    ##### ASSIST V4


    **Substance use in past 12 months and impact after pregnancy**


    - `[12m_use]` IN THE PAST TWELVE MONTHS, how often have you used any of the following substances for any reason?

    - `[problem]` DURING THE PAST TWELVE MONTHS, has your use of this substance led to physical or mental health, social, or financial problems?

    - `[perform]` DURING THE PAST TWELVE MONTHS, have you ever failed to do what was normally expected of you (like work, go to school, be a parent, or household tasks) because of your use of this substance?'
  full_name: Alcohol, Smoking and Substance Involvement Screening Test V1-V4
