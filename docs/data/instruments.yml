  description: The **ecPROMIS** (Early Childhood Patient-Reported Outcome Measurement Information System) is a set of primary caregiver report questionnaires that offer clinicians and researchers a brief, efficient, and precise way to evaluate young children’s well-being. The **Peer Relationships Scale **assesses young children’s positive peer interactions, sociability (getting along well with others), and empathic behaviors.
  slug: ecpromis-peer-relationships-scale
  domain: Behavior & Caregiver-Child Interactions
  release: '2.1'
  qc: |-
    - Examine missingness by counting items answered per participant.
    - Check age is within expected ranges.
    - Review summary statistics and visualizations (item frequencies, age, prorated scores).
  administration: Remote
  scoring: |-
    The Peer Relationship Scale includes one unscored item (`peer_yn`) and 4 scored items, each rated on a **5-point scale** (_1 = Never; 2 = Almost Never; 3 = Sometimes; 4 = Often; 5 = Almost Always_). Responses of **"Decline to Answer"** are treated as missing. A total score is only calculated when **at least 3 of 4 items** are answered and otherwise will be missing. If all 4 items are completed, the total score is the sum of the item scores. If exactly **1 item** is missing, a prorated score is calculated as follows:

    **_Prorated Score = _**_(Sum of answered items ÷ Number of answered items) × 4_
