  warning1: The Study Navigator Contact Form was created for the HBCD Study as a document for characterizing participant contacts and support. The form was developed by integrating metrics from documents used in similar support professions (e.g. certified peer support, case managers, doulas, social workers, etc.). Use of the form was strongly encouraged, but not mandatory for Study Navigators to complete.
  description: "The **Study Navigator Contact Form** captures visit-specific information when participant support is provided, provided as [concatenated data](https://docs.hbcdstudy.org/2.1/datacuration/file-based-data/#concatenated-data) within the HBCD data release. \n\nRecruitment and retention in studies involving pregnant individuals who use substances can be challenged by mistrust due to SUD-related stigma. To address this, the HBCD Study integrates certified [peer support](https://www.sciencedirect.com/topics/nursing-and-health-professions/peer-group) specialists and/or other support professionals (case managers, doulas, social workers, etc.) i.e., Study Navigators, to provide participant-centered support (substance-involved or otherwise) throughout the study. A “contact” includes all scheduled or unscheduled interactions relevant to the study or when providing additional support services to the participant. Contacts can be face-to-face interactions, phone calls, text chats, or other\
    \ forms of communication between a participant and a research team member providing navigation services. The breadth of the provision of Study Navigator support is determined based on the needs and capacity of each HBCD site. For details on the conceptual framework, core skills, training, and team integration of support professionals, see [Hilliard et al. 2025](https://doi.org/10.1016/j.dcn.2024.101495).    \n\nThe HBCD Study Navigator Workgroup created this form in 2022 by integrating contact form information from other behavioral health practices. The “Support Services Offered” section of the form is original and was created specifically for the HBCD study. This data is purely descriptive and thus not scored. It documents: visit details (date, time, location, scheduling, etc.), support topics discussed, and actions taken during each contact. Options for **actions taken** include the following:\n\n- **Referrals:** The navigator initiates a connection between individuals or entities\
    \ (e.g., a community service, clinical service, or research team member) to help the participant access needed support or services. \n- **Resources:** The navigator shares information (e.g., flyers, brochures, websites) that the participant can use to obtain additional information, support, or services.\n- **Discussion:** The participant asks the navigator to listen and/or discuss sensitive matters related to the research study or their personal life. When appropriate, navigators remind participants that they are mandatory reporters. A discussion may lead to a referral or the provision of resources.\n- **Other:** Any other support provided by the navigator that does not fit the categories of referral, resource, or discussion."
  slug: study-navigator-contact-form
  domain: Administrative
  release: '2.1'
  qc: This form is under development for HBCD. Data was collected with guidance using the [HBCD Study Navigation Contact Form Guide](https://docs.hbcdstudy.org/latest/resources/SNContactFormCompanionGuideOutline_Pilot_V4-HH.pdf). Data review and cleaning has occurred 3 times (September 2024, February 2025, and November 2025). Minor updates to the form and the form guide were completed in September 2024 and October 2025.
  administration: In-person/Remote
  scoring: null
  all_warnings_collapsed: |-
    Background Information
    The Study Navigator Contact Form was created for the HBCD Study as a document for characterizing participant contacts and support. The form was developed by integrating metrics from documents used in similar support professions (e.g. certified peer support, case managers, doulas, social workers, etc.). Use of the form was strongly encouraged, but not mandatory for Study Navigators to complete.

    Variation Across Sites
    There is wide variation across HBCD sites and Study Navigators in use of the forms, which should be considered in any analyses conducted and conclusions drawn using contact form data. Additionally, some HBCD sites provided study navigator support to all participants, and some sites focused support on participants with substance use and/or participants experiencing significant adversities.
  resources: null
  measure: Study Navigator Contact Form
  construct: Recruitment/Retention
