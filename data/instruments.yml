    ##Transition in Care variable

    The Transition in Care (TIC) variable in the dynamic table is derived from 2 measures: (a) the Transition in Care Screener, which is administered by Research Assistants prior to each visit starting with V2, and (b) the Transition in Care Questionnaire, which is completed by participants at V6 and V8. The TIC derived variable indicates whether or not a child ever experienced a change in primary caregiver, either temporary or permanent, and reflects informal placement with relatives as well as formal placements like foster care and kinship care. (defined as 0 = not experienced a TIC, and 1 = experienced a TIC).

    (link to TIC Screener and TIC Questionnaire READ ME documents, which provide more details and references)
