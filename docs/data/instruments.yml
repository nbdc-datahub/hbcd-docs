  description: |-
    The **ecPROMIS** (Early Childhood Patient-Reported Outcome Measurement Information System) is a set of primary caregiver report questionnaires that offer clinicians and researchers a brief, efficient, and precise way to evaluate young children’s well-being. One of its key components is the **Child–Caregiver Relationship Scale**, which evaluates the degree to which young children develop close, satisfying relationships with caregivers.

    For the HBCD study, the ecPROMIS Child–Caregiver Relationship Form was developed based on the ecPROMIS Parent-Report Short Form v1.0 – Social Relationships: Child–Caregiver Interactions 5a. Because the original measure was designed for children aged **1–5 years**, an adapted version was created for **infants under 1 year** (i.e. 3-9 month old infants from visit V03), replacing the term ‘my child’ with 'my baby' per the guidance of ecPROMIS developers.
  slug: ecpromis-caregiver-child-relationship-scale
  domain: Behavior & Caregiver-Child Interactions
  release: '2.1'
  qc: |-
    - Examine missingness by counting items answered per participant.
    - Check age is within expected ranges.
    - Review summary statistics and visualizations (item frequencies, age, prorated scores).
  administration: Remote
  scoring: |-
    The Caregiver-Child Relationship Scale includes 5 items each rated on a 5-point scale (_1 = Never; 2 = Rarely; 3 = Sometimes; 4 = Often; 5 = Always_). Responses of **"Decline to Answer"** are treated as missing. A total score is only calculated when **at least 3 of 5 items** are answered and otherwise will be missing. If all 5 items are completed, the total score is the sum of the item scores. If 1 or 2 items are missing, a prorated score is calculated as follows:

    **_Prorated Score = _**_(Sum of answered items ÷ Number of answered items) × 5_
  all_warnings_collapsed: |-
    Data Interpretation
    The ecPROMIS assesses normative variations in child behavior and should be interpreted within the context of the child's age and developmental stage. This is not clinical or diagnostic instrument.

    Administration at V05 (<1 year vs. 1–5 years)
    At V05 (10–17 months), the standard administration is the child (1–5 years) version of the ecPROMIS Child–Caregiver Relationship Scale. A small subset of participants (N=11) were administered both the child and infant (<1 year) versions at this visit. Although data from both instruments are valid, we recommend using the 1–5 years version for V05 analyses to ensure consistency across participants, as most were administered only the 1–5 years version.
  resources: null
  measure: ecPROMIS Caregiver-Child Relationship Scale
  construct: Relationships
