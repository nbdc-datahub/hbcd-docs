  primary_data_type: Tabulated data
  acronym: PTSD/Acute Stress
  Form Link: https://form.fillout.com/t/qaNxHYsnPBus?id=rechNRRhBsfQYdbmi
  description: 'This measure is a combination of two measures:


    - Severity of Posttraumatic Stress Symptoms-National Stressful Events Survey PTSD Short scale ([NSESSS-PTSD](https://www.psychiatry.org/File%20Library/Psychiatrists/Practice/DSM/APA_DSM5_Severity-of-Posttraumatic-Stress-Symptoms-Adult.pdf))

    - Severity of Acute Stress Symptoms—Adult National Stressful Events Survey Acute Stress Disorder Short Scale ([NSESSS-Acute stress](https://www.psychiatry.org/File%20Library/Psychiatrists/Practice/DSM/APA_DSM5_Severity-of-Acute-Stress-Symptoms-Adult.pdf))


    The NSESSS-acute stress is a 7-item scale, 6 of which are from the NSESSS-PTSD short scale, with one additional question. As such, the measures were combined into one administration. Publications should note the combined administration. Thus, the scales are as follows:


    - Total Raw Score PTSD (Total of Questions 1, 2, 3, 4, 5, 6, 7, 8, 9)

    - Total Raw Score Acute Stress (Total of Questions 1, 2, 3, 7, 8, 9, 10)


    **Questionnaire prompt/instructions:**

    > People sometimes have problems after extremely stressful events or experiences. How much have you been bothered during the PAST SEVEN (7) DAYS by each of the following problems that occurred or became worse after an extremely stressful event/experience?'
  slug: copy-dummy-form-dsm5-severity-acute-stress-or-ptsd
  domain: NA/Testing
  release: '2.1'
  qc: '- Checks for missing data based on counts for items completed by each participant.

    - Verification of scoring accuracy.

    - Summary statistics to examine item-level frequencies and total scores.

    - Review of response distributions for potential outliers.'
  administration: In-person/Remote
  scoring: 'Two summary scores are calculated from the PCL-C:


    **(1) NSESS-PTSD**


    - Assesses PTSD symptom severity over the past 7 days.

    - Includes **9 items** (Questions 1–9), each rated from 0 to 4.

    - Total score ranges from **0 to 36**; higher scores indicate greater PTSD symptom severity.

    - Calculated when **at least 7 of 9 items** are answered. If 1–2 items are missing, a prorated score is calculated:


    **_Prorated Score _**_= (Raw sum × 9) ÷ Number of answered items_


    **(2) NSESS-Acute Stress**


    - Assesses acute stress disorder symptom severity over the past 7 days.

    - Includes **7 items **(Questions 1–3 and 7–10), each rated from 0 to 4.

    - Total score ranges from **0 to 28**; higher scores indicate greater acute stress symptom severity.

    - Calculated when **at least 6 of 7 items** are answered. If 1 item is missing, a prorated score is calculated:


    **_Prorated Score _**_= (Raw sum × 7) ÷ Number of answered items_


    Prorated scores are rounded to the nearest whole number. If fewer than the minimum required number of items are answered, no total score is calculated.'
  measure: 'COPY/DUMMY FORM: DSM5 Severity Acute Stress or PTSD'
  construct: PTSD/Acute Stress Disorder Symptom Severity
