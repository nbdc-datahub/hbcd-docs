    Putnam, S. P., Helbig, A. L., Gartstein, M. A., Rothbart, M. K., & Leerkes, E. (2014). Development and assessment of short and very short forms of the infant behavior questionnaire-revised. _Journal of Personapty Assessment_, 96(4), 445–458. <https://doi.org/10.1080/00223891.2013.841171>

    Putnam, S. P., Jacobs, J., Gartstein, M., & Rothbart, M. K. (2010). _Development assessment short very short forms Early Childhood Behavior Questionnaire. In Poster presented International Conference Infant Studies ([LINK](http://research.bowdoin.edu/rothbart-temperament-questionnaires/files/2016/09/ICIS_2010_ECBQ_sf_poster.pdf))._

