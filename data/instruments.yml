  warning1: The co-occurrence of psychiatric symptoms and substance use during pregnancy is well-documented ([Massey et al., 2011](https://doi.org/10.1111/j.1521-0391.2010.00110.x), [Massey et al., 2012](https://doi.org/10.1016/j.addbeh.2012.04.002)). Phenotypic risk in birthing parents may affect offspring neurodevelopment through both prenatal and postnatal mechanisms, beyond direct exposure alone ([Estabrook et al., 2016](https://doi.org/10.1007/s10519-015-9762-2), [Massey et al., 2016](https://doi.org/10.1016/j.ntt.2015.11.010), [Massey et al., 2018](https://doi.org/10.1016/j.ntt.2018.02.003)). These factors may confound associations between exposures and neuroimaging or neurodevelopmental outcomes, but they also represent malleable targets for prevention and early intervention. When possible, incorporating parental mental health symptoms as covariates offers a robust strategy to account for these confounding influences.
  description: 'The HBCD mental health screening instrument is a two-level screening tool adapted from the [DSM-5 Self-Rated Level 1 and Level 2 Cross-Cutting Symptom Measures](https://www.psychiatry.org/getmedia/e0b4b299-95b3-407b-b8c2-caa871ca218d/APA-DSM5TR-Level1MeasureAdult.pdf). **Level 1** serves as the initial screening assessment and includes 1–2 questions for each of the first 11 mental health domains listed in Table 1 at the link above (Depression through Dissociation). When a participant endorses symptoms on a Level 1 domain, the corresponding **Level 2** assessment is administered. Level 2 provides a more detailed evaluation of symptoms for the following eight domains: _Depression_, _Anger_, _Mania_, _Anxiety_, _Somatic Symptoms_, _Sleep_, _Repetitive Behavior_, and _Personality_.'
