  description: "Demographic information is crucial for understanding the child’s environment and identifying how social, structural, and economic factors influence development over time in a longitudinal study of child development. The **HBCD Study demographics survey at V01** was designed to gather comprehensive information on socioeconomic status and various demographic factors. Its primary purpose is to capture data on race, ethnicity, nativity, income, education, and occupation, as well as relationship status, primary residence, and household composition of the parent carrying the child, and some basic information on the other biological parent. Please see [Cioffredi et al. 2024](https://doi.org/10.1016/j.dcn.2024.101429) for a detailed description of the baseline HBCD Demographics survey.  \n\n \n\n**At subsequent times of assessment (i.e., V04+)**, a selected set of variables that can change over time were re-administered, and several new questions were added (i.e., disability status\
    \ and access to reliable transportation). Of note, from V04 onward, there is a separate [Child Demographics](https://docs.hbcdstudy.org/latest/instruments/SED/demo-ch/) form that includes child-focused information including child race and ethnicity, relationship to the child/custody, household roster, type of residence, and household income. In addition, from V04 onward, data on caregiver work/employment characteristics are captured by the [Current Employment](https://docs.hbcdstudy.org/latest/instruments/SED/current-employment/) form."
