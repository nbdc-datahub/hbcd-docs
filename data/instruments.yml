  description: This is an assessment of long-term memory. Children are shown two action sequences with novel props and after 10min (minimum) their memory for the action sequences is assessed.  A baseline is included to control for problem solving/creativity.  Administration is standardized, parents/caregivers should NOT help their children.
  slug: deferred-imitation-task-gong-and-berry-go-round
  supp3_text: null
  domain: Neurocognition & Language
  release: '3.0'
  qc: "++**Deferred imitation methods**++\n\nWritten by Tracy Riggins, Edited by SarahJane Dube, Reviewed by Alexi Potter, Julie Kable  and Natacha Akshoomoff\n\n8/5/25\n\n**Visit 6:**\n\nAn SOP was provided with detailed administration and scoring instructions. Training was conducted via Zoom and in-person sessions and consisted of detailed descriptions and example videos.\n\nEach RA went through a two-step certification process – administration and scoring. For the first step, each RA administered the V06 deferred imitation protocol to an adult, video recorded it, filled out a self-assessment form (with scores) and submitted these materials to the Infant Testing Core for review. An expert (TR, ZC, IS, SD, NS, AG) reviewed the video for both administration and scoring accuracy.  Feedback was always given.  If the _administration_ met a standard threshold (no major administration errors), the RA was certified to administer the task.  If the _administration_ did not meet threshold, the RA\
    \ was asked to submit another video. If scoring was inaccurate, this was communicated to the RA so they could correct it in the second certification step. This process continued until the RA submitted a video that met threshold, at which point RAs were certified in administration and released to proceed to the second step.\n\nRAs who were certified to administer the task, then video recorded their administration to a child (pilot OR main study) participant. RAs scored the child’s performance (in LORIS for main study participants, on the self-assessment form for pilots) and an expert (TR, ZC, SD, NS) reviewed the video for ++both administration and scoring accuracy++.  Feedback was always given.  If the administration met a standard threshold (i.e., no administration or scoring errors), the RA was certified in scoring the task and fully certified to administer deferred imitation in main study without the need for expert video review.  If the administration did not meet threshold, the\
    \ RA was asked to submit another video with a different child participant and submit the video for review.  If during any video review, scores were incorrect, the RA was asked to correct them in LORIS _and make a note to this effect in the RA comments_.  The expert reviewer ensured the scores were updated accurately and noted this in the certification log notes.  \n\nAfter the two-step certification process, RAs were released to administer and score deferred imitation to child participants without video review.\n\n \n\n \n\n**Visit 8:**\n\nAn SOP was provided with detailed administration and scoring instructions. Although the core concepts are the same for the deferred imitation task at V06 and V08, the event sequences differ, therefore there was a need for expert review, despite the previous certification. Training was conducted via Zoom and in-person sessions and consisted of detailed descriptions and example videos. \n\nEach RA was asked to record their first V08 child participant\
    \ (pilot OR main study), score the child’s performance (in LORIS for main study participants, on the self-assessment form for pilots) and submit for expert review.  An expert reviewer (TR, ZC, SD, NS) reviewed the video for accuracy.  Feedback was always given.  If the administration met a standard threshold (i.e., no major administration or scoring errors), the RA was approved to continue without video expert review.  If the administration and/or scoring did not meet threshold, the RA was asked to submit a video of their next V08 DI administration with another child participant.  Until approved for V08, any incorrect scores were corrected by the RA in LORIS and a note was made to this effect in the RA comments.  The expert reviewer ensured the scores were updated accurately and noted this in the data log notes."
  administration: In-person
  scoring: Each target action is recorded. Pairs of actions in the correct temporal order are automatically calculated.  Actions and pairs of actions are summed across event sequences.
