  description: "**EEG Acquisition Flags for V03, V04, V06**    \n\n \n\n- `Bgn+` — Start of task   \n\n- `bas+` — Start of RS video\n\n- `DIN3` — StimTracker flag for visual stimuli   \n\n- `TRSP` — End of stimulus presentation, contains additional stimulus information  \n  \nThe Video Resting State Task (**RS**) (v.11.29.23) provides assessment of the development of large-scale neural networks during infancy and early childhood via information about neural oscillations measured in EEG power across the scalp. Developmental changes in oscillatory activity reflect underlying developing large-scale neural networks associated with early self-regulatory, cognitive, and affective processes and developmental outcomes ([Gabard-Durnam et al., 2019](https://doi.org/10.1038/s41467-019-12202-9); [Jones et al., 2020](https://doi.org/10.1038/s41598-020-67687-y); [Whedon et al., 2020](https://doi.org/10.1016/j.bandc.2020.105636)). The metrics derived from the resting EEG signal include power across the\
    \ frequency spectrum ([Gabard-Durnam et al., 2019](https://doi.org/10.1038/s41467-019-12202-9)) and relative power between different scalp locations ([Davidson & Fox, 1982](https://doi.org/10.1126/science.7146906)).\n\n### RS Protocol Summary\n\nParticipants watch a silent video for the duration of the RS task. In **V03** (_left set of images below_), the video displays a variety of colorful and abstract toys and other visuals. In **V04 & V06** (_right set of images below_), the video includes a variety of marble run and construction visuals.\n\n<img src=\"../images/eeg-RS.png\" width=\"100%\" height=\"auto\">"
