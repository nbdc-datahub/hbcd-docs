  description: |-
    Datasets within the Demographics domain are intended to provide HBCD investigators with a concise set of commonly used variables without requiring users to navigate multiple source files. The Dynamic Table (`TABLE_NAME`) is a **derived measure** with information computed administrative data and study instruments such as the Adult and Child Demographics (`sed_{bm|ch}_demo`). Dynamic data include critical participant- and visit-level data that, unlike the Static Table variables, may vary across study visits.

    The following variables are computed from administrative records collected during screening or instruments such as the Demographics measure ([Adult](https://docs.hbcdstudy.org/3.0/instruments/SED/demo-cg/) or [Child](https://docs.hbcdstudy.org/3.0/instruments/SED/demo-ch/)). Sources are noted in the Description field and otherwise can be assumed to be derived from administrative records.

