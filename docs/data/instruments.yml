  description: "## Instrument Details\n\nGenomic data generated from the **Illumina Global Diversity Array (GDA GWAS)** is provided for both the birth parent and child. Samples are assayed from one sample, but may come from any visit (V01-V06) based on DNA yields. The dataset includes batch metadata and interlinked PLINK files (`.bed`, `.bim`, `.fam`) aligned to the **GRCh38/hg38 Build**. \n\n## Release Data\n\nThe GDA GWAS dataset is provided as [concatenated data](http://127.0.0.1:8000/datacuration/file-based-data/#concatenated-data) including the following files:\n\n- `batch.info`: Plain-text file mapping participants to genotyping batches\n- `hbcd.bed` ([PLINK 1.9 .bed](https://www.cog-genomics.org/plink/1.9/formats#bed), distinct from UCSC BED): Binary genotype file\n- `hbcd.bim` ([PLINK 1.9 .bim](https://www.cog-genomics.org/plink/1.9/formats#bim)): Variant information (chromosome, rsID, position, alleles)\n- `hbcd.fam` ([PLINK 1.9 .fam](https://www.cog-genomics.org/plink/1.9/formats#fam)):\
    \ Participant information\n- `pcrelate_relatedness.grm.bin`: PC-Relate adjusted genetic relatedness matrix\n- `pcrelate_relatedness.grm.N.bin`: PC-Relate pairwise common SNP count\n- `pcrelate_relatedness.grm.id`: PC-Relate subject IDs, corresponding to the matrix column and row order\n- `pcrelate_relatedness.tsv`\n- `family_clusters.txt`"
  slug: illumina-global-diversity-gwas-array-3-0-
  domain: Biospecimen & Omics
  release: '3.0'
  alert3_title: Ethical Obligations to Minimize Risks
  qc: |-
    - Check that sampled ID and sample-specific barcodes match from Sampled File and Lasso Database.
    - Check that genomic sex matches with sex at birth.
    - Check that genetic relatedness of each sample matches Lasso data (i.e., that IBD is ~0.25 between the birth parent and child as well as siblings; evaluate potential twins).
    - Use FHET estimates to check for plate contamination.
    - Visually inspect plate effects on principal component space derived from PC-Relate.
    - GDC Genomics QC pipeline analysis - see details and summary statistics [below](#gdc-genomics-qc-pipeline-analysis).
  administration: In-person
  scoring: null
