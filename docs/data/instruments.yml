  hbcd_mods1: |-
    For Level 1, "Personality Functioning and Substance Use," present in the original measure, was excluded (already captured by a PEX Substance Use instruments).

    Level 2 symptom measures for Depression and Sleep Disturbance were replaced with the PROMIS Short Forms v1.0 Depression 8a and Sleep Disturbance 8a. Level 2 also includes the Personality Inventory for DSM-5 Brief, which assesses five personality trait domains: Negative Affect, Detachment, Antagonism, Disinhibition, and Psychoticism.

    Gating procedures were adapted for the HBCD population. Participants automatically advanced to the Level 2 Personality Inventory without completing Level 1. For Depression and Somatic Symptoms, all participants completed Level 1 items and proceeded to Level 2 questions regardless of their responses. Future publications should acknowledge the removal of Level 1 and Level 2 Substance Use measures, as well as the modified gating procedures for Personality Inventory, Depression, and Somatic Symptoms.
