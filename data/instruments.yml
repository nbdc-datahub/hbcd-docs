    **Meds:** Medication names are queried from the RxNORM database and reasons for medication use are captured from ICD codes (from BioPortal ICD). Reasons for use were sometimes difficult for the participant to name and/or HBCD study staff to find in the ICD database. This was apparent with aspirin for preeclampsia prevention, as there was not an option for coding preventive use. Aspirin was later moved to the prenatal vitamin section as a result. Additionally, medications used PRN (“as needed”) were difficult for participants to report. Finally, although not asked, some medications were coded with dose, but this was not asked and should not be used.'
