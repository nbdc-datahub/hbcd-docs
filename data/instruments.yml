  description: "HBCD protocols for structural MRI were informed by recent large-scale developmental neuroimaging studies including [ABCD](https://abcdstudy.org/), HCP Lifespan, and BCP ([Howell et al., 2019](https://pubmed.ncbi.nlm.nih.gov/29578031/)). These studies laid critical foundation for the development of well-validated, high-resolution protocols harmonized across all three major scanner vendors ([Casey et al., 2018](https://doi.org/10.1016/j.dcn.2018.03.001)). In addition, the findings emphasized the importance of T2w acquisition in infants due to suboptimal grey/white T1w contrast resulting from incomplete myelination ([Howell et al., 2019](https://doi.org/10.1016/j.neuroimage.2018.03.049), [Myers et al., 2023](https://doi.org/10.1016/j.neuroimage.2018.03.049)). Acquisition parameters are as follows:\n\n- 0.8 mm isotropic resolution\n- Compressed SENSE reconstruction enabling high acceleration and shorter acquisition times (<9 min total for T1w & T2w)\n- Embedded navigators for\
    \ motion tracking ([White et al., 2010](https://doi.org/10.1002/mrm.22176), [Tisdall et al., 2016](https://doi.org/10.1016/j.neuroimage.2015.11.054), [Andersen et al., 2019](https://doi.org/10.1371/journal.pone.0217145))\n- Harmonization approach similar to the [ABCD Study](https://nbdc-splash-beta.lassoinformatics.com/abcd-study):\n    - T1w: contrast-relevant parameters matched as closely as possible across vendors\n    - T2w: vendor-specific parameters selected to achieve comparable contrast and SNR, accounting for differences in 3D T2w pulse sequence implementation"
  slug: structural-mri
  domain: Imaging/Tabular Imaging
  release: '2.1'
  administration: In-person
  measure: Structural MRI
