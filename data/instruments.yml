  description: "The National Institute of Health (NIH) Infant and Toddler Toolbox (NBT) is a new nationally-normed assessment. HBCD administered modules to measure cognition, language, early mathematics/numeracy, and executive function in children between 1- and 42-months of age. Assessments include direct child assessment and observations supplemented as needed by reporting from parents or legal guardians. In addition, gaze-based measures were used to assess aspects of cognitive functioning in children under 24 months of age and touch screen measures were used for children who were 24 months or older.  The NIH Baby Toolbox Cognition Domain provides individual performance measures or scores and composite scores. \n\nAdditional supplemental tests were also used that do not contribute to the composites but can be used to better understand the child's cognitive skills.  Please see the NBT instructional manual for details. These are available from [NIH Baby Toolbox® Manuals & Test Materials](https://resources.nihtoolbox.org/manuals-and-test-materials/nih-baby-toolbox-documentation/)."
