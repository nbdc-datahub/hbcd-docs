  hbcd_mods1: 'Alterations were made to replace “parent” with “parent/caregiver” where appropriate. In addition, the pronouns "she/he" or "her/him" in reference to the child/baby were changed to “the baby/child” or “they/them” as fit the item wording.


    The creators of this measure have requested that these alterations be noted in all documentation and publications.'
