  description: "See [Basic Demographics](../../demo/basicdemo/) for additional demographics variables derived from HBCD Demographics and administrative records collected during study enrolment/screening.\n\n \n\nDemographic information is crucial for understanding the child’s environment and identifying how social, structural, and economic factors influence development over time in a longitudinal study of child development. **Beginning at Visit 4, the study includes a child demographic form** that captures detailed information about the child’s background, family structure, and household environment (see [Sources for Demographic Protocols & Modifications](http://127.0.0.1:8000/instruments/SED/demo-cg/#demo-tables)). This includes:\n\n \n\n- Child's sex at birth\n- Child's race and ethnicity (with multiple selections allowed to capture diverse identities)\n- Respondent's relationship to the child, legal guardianship status, and whether the respondent lives with the child (including the number\
    \ of days per month they share residence)\n- Detailed household composition, including the number of adults and children in the home and a household roster listing all individuals who live with the child at least two nights per week (including their age and sex)\n- Total household income for the past year (if the child resides in more than one household, respondents are asked to provide the average household income across residences)\n\n \n\nThese data are designed to support a nuanced analysis of the child’s social and family context within the HBCD study. See [Cioffredi et al. 2024](https://doi.org/10.1016/j.dcn.2024.101429) for a detailed description of the HBCD Demographics survey."
