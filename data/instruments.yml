  description: Multidimensional Assessment Profiles- Early Assessment Screener for Irritability (**MAPS-EASI**) is a newly developed MAPS-TL (MAPS- Temper Loss) short form. MAPS-TL is a well-validated survey assessing irritability that serves as a tool for characterizing the developmental expression of early mental health risk. MAPS-TL measures a range of behaviors that encompass dysregulation, responsiveness to environmental input, and context. Irritability has been identified as an early dimensional marker of lifespan mental health risk. MAPS-TL aims to delineate the typical:atypical spectrum of irritability in early childhood and identify those young children at high probability of subsequent adaptational problems based on problems with dysregulation.
